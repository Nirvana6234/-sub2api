[package]
name = "codex-adapter"
version = "0.1.0"
description = "共飞 AI 工作台与 codex app-server 之间的适配层：只说协议，不认识 Tauri，也不认识 UI"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "sync", "macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "sync", "macros", "rt-multi-thread", "time"] }
