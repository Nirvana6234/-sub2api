[package]
name = "chat"
version = "0.1.0"
description = "Chat multi-platform app for sub2api"
authors = ["AI-Fly"]
license = "MIT"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5.1", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "1.5.4", features = [
  "http-all",
  "shell-open",
  "window-close",
  "window-hide",
  "window-maximize",
  "window-minimize",
  "window-show",
  "window-start-dragging",
  "window-unmaximize",
  "window-unminimize",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
