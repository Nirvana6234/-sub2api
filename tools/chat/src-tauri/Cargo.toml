[workspace]
members = ["crates/*"]

[package]
name = "chat"
version = "0.1.0"
description = "Chat multi-platform app for sub2api"
authors = ["AI-Fly"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

# lib + bin：桥的逻辑放 lib，main.rs 只剩一行。这样集成测试能直接驱动桥，
# 不必绕过 Tauri 的 invoke 机制 —— 命令函数本身只是三行的转接。
[lib]
name = "chat_lib"
path = "src/lib.rs"

[dependencies]
codex-adapter = { path = "crates/codex-adapter" }
codex-host = { path = "crates/codex-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# `devtools`: 没有它，release 构建下 F12/右键"审查"大概率打不开——2026-09-09
# 排查一个正式包里"卡在本地工作区准备"的挂起时才发现这个缺口：日志系统
# 没有（见下面 tauri-plugin-http 那条注释旁边，这个项目至今没接
# tauri-plugin-log），出问题时除了这一条别无办法看现场。开着它的代价很小
# ——多给用户一个能看到网络请求/控制台报错的入口，这个应用本来就只连自己
# 的后端，不是敏感到不能被自己人查的程度。
tauri = { version = "2.11", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
