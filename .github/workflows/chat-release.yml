# Chat 桌面端（tools/chat）—— 出包
#
#   打 tag：  git tag chat-v0.1.0 && git push origin chat-v0.1.0
#   或在 Actions 页面手动运行（workflow_dispatch）。
#
# 产出
#   Chat_<版本>_x64-setup.exe   NSIS 安装包
#   Chat_<版本>_x64.msi         MSI 安装包
#
# 为什么只有 windows-latest
# -------------------------
# 开发计划明写"mac 相关全部不卡开工，Windows 先行"（进程笼、随包 codex 二进制
# 目前都只有 Windows 版）。macOS 目标要等对应的 codex-app-server 产物和签名
# 方案定下来再加，跟 client-release.yml 的 Windows 优先顺序是同一个道理。
#
# 随包的 codex 二进制不进 git
# ---------------------------
# `src-tauri/vendor/codex/` 里的可执行文件（229MB）按 .gitignore 的规则不入库，
# 真值来源是 `src-tauri/crates/codex-host/tests/fixtures/bundled-codex.json`
# （来源 URL + 上游 tag + 每个文件的 sha256）。`npm run codex:vendor` 照这份
# 清单把它们取回来、校验、删掉用不上的 code-mode-host.exe——本地开发和这条
# 流水线走的是同一个脚本，不是本地一套、CI 另一套。

name: chat-release

on:
  push:
    tags:
      - 'chat-v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否创建 GitHub Release（否则只产出构建工件）'
        type: boolean
        default: false

# 只给创建 Release 所需的写权限，其余保持只读——道理与 client-release.yml 一致：
# 不写这一块的话，构建、打包全部跑完之后才会在最后一步因权限不足而 403。
permissions:
  contents: write

defaults:
  run:
    working-directory: tools/chat

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # 版本号读取（下一步）要用 `node -p`，windows-latest 镜像上带不带 Node
      # 由 GitHub 自己决定，不该赌它——显式装一次。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/chat/package-lock.json

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "::error::读不出 src-tauri/tauri.conf.json 里的 version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Chat 版本：$version"

      - name: tag 与 tauri.conf.json 版本一致
        if: startsWith(github.ref, 'refs/tags/chat-v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#chat-v}"
          if [ "$tag_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag 是 $tag_version，而 tauri.conf.json 里的 version 是 ${{ steps.version.outputs.version }}"
            exit 1
          fi

      # PAW_SERVICE_URL 烧进桌面包里之后不能在 Chat 内编辑（见 tools/chat/README.md）。
      # 发错地址不会报任何错，只会让装好的客户端连到错的后端——跟
      # client-release.yml 里"服务器地址不是占位符"是同一类事故，同样值得在
      # 构建阶段而不是用户手里发现。这里要求维护者在仓库 Settings → Secrets and
      # variables → Actions → Variables 里配好 CHAT_SERVICE_URL。
      - name: 服务器地址已配置且不是占位符
        shell: bash
        env:
          SERVICE_URL: ${{ vars.CHAT_SERVICE_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "::error::仓库变量 CHAT_SERVICE_URL 没配置——Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          case "$SERVICE_URL" in
            *127.0.0.1*|*localhost*|*sub2api.example.com*)
              echo "::error::CHAT_SERVICE_URL 看着像占位符或本机地址：$SERVICE_URL"
              exit 1
              ;;
          esac

      - name: 安装前端依赖
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # keyed by Cargo.lock：workspace 里任何一个 crate 的依赖变了都会失效重建，
      # 不会拿旧依赖悄悄编出一个跟仓库不一致的产物。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/chat/src-tauri/target
          key: chat-cargo-${{ runner.os }}-${{ hashFiles('tools/chat/src-tauri/Cargo.lock') }}
          restore-keys: |
            chat-cargo-${{ runner.os }}-

      # 229MB 的二进制不进 git，按 bundled-codex.json 里钉的 tag+sha256 现取——
      # 校验通过就跳过下载，缓存命中时这一步几乎是瞬间的。
      - uses: actions/cache@v4
        with:
          path: tools/chat/src-tauri/vendor/codex
          key: chat-codex-vendor-${{ hashFiles('tools/chat/src-tauri/crates/codex-host/tests/fixtures/bundled-codex.json') }}

      - name: 取随包 codex 二进制
        run: npm run codex:vendor

      - name: 构建桌面安装包
        env:
          PAW_SERVICE_URL: ${{ vars.CHAT_SERVICE_URL }}
        run: npm run app:build

      - name: 清单
        shell: bash
        run: |
          find src-tauri/target/release/bundle -maxdepth 2 -type f

      - uses: actions/upload-artifact@v4
        with:
          name: chat-v${{ steps.version.outputs.version }}-windows
          path: |
            tools/chat/src-tauri/target/release/bundle/msi/*.msi
            tools/chat/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

      # tag 触发时自动创建；手动触发时默认只留构建工件，避免误发——跟
      # client-release.yml 是同一个策略。
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/chat-v') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tools/chat/src-tauri/target/release/bundle/msi/*.msi
            tools/chat/src-tauri/target/release/bundle/nsis/*.exe
          draft: true
          name: Chat v${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
