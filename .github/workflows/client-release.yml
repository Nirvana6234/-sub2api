# 共飞直连客户端 —— 出包
#
#   打 tag：  git tag client-v1.0 && git push origin client-v1.0
#   或在 Actions 页面手动运行（workflow_dispatch）。
#
# 产出
#   codex-relay-client_v<版本>_x64.zip            Windows 单文件，带 context-filter 与微信读屏组件
#   codex-relay-client_v<版本>_macos-arm64.tar.gz macOS .app（自签名证书签名，带 context-filter 与微信读屏组件）
#
# 微信读屏组件（wechat-reader，「探索」页的微信消息意图判断）是 -p:IncludeWeChatReader=true
# 才编进去的独立进程，两个包都带。Windows 版是 .NET，随 win-x64 发布一起编；macOS 版是
# Swift，只能在 Mac 上编译——所以先由 mac-reader 任务在 macOS runner 上编出通用二进制
# （arm64 + x86_64），再交给这里的 osx-arm64 发布（WeChatReaderMacBinary）。
# context-filter 的 macOS 版由上游随每个版本发布（darwin-arm64），同一个任务按
# bundled-context-filter/VERSION 下载、对照上游 SHA256SUMS 校验后一并交过来（ContextFilterMacBinary）。
#
# 为什么整条流水线在 windows-latest（2× 计费）
# --------------------------------------------
# 方案 §9.5.3 说终局可以全部搬到 ubuntu-latest（1×），Avalonia 头两个目标都能在
# Linux 上交叉编译。那是对的，但**那条路没有人实测过**；而这里的每一步都在
# Windows 上端到端验证过（裁剪发布、Mach-O 产物、.app 组装、tar 权限位）。
# 发布是按 tag 触发的低频任务，省下的分钟数远不值得拿「出包能不能成」去换。
# 等有人在 ubuntu 上实测通过，再迁移不迟。
#
# 唯一的 secret：macOS 代码签名证书
# ---------------------------------
# 不买开发者账号 = 不做公证 = 没有 Apple 凭据要管（§9.5.2）。但 macOS 按签名里的「指定要求」
# 认一个 App：ad-hoc 签名的指定要求是这次构建的 cdhash，每个版本都不同，于是每次升级后
# 「屏幕录制」（探索页读微信）要重新授权，钥匙串「始终允许」也会再问。
#
# 所以 1.0 起改用一张固定的自签名证书签：指定要求变成
#   identifier "com.gongfeiai.chatgpt-assistant" and certificate root = H"<证书 SHA-1>"
# 每个版本都一样，授权随升级保留。它仍不能公证，Gatekeeper 照旧拦浏览器下载的包，
# 所以安装方式不变（install-mac.sh）。
#
#   MACOS_SIGNING_P12_BASE64    私钥 + 证书（p12）的 base64
#   MACOS_SIGNING_P12_PASSWORD  p12 的密码
#
# 由 packaging/macos/new-signing-cert.sh 一次性生成，公开证书 signing-cert.pem 提交在仓库里，
# 签完核对指定要求里的指纹与它一致——secret 被换成别的证书时在这里失败，而不是让所有用户
# 悄悄重新授权一遍。私钥泄露或丢失才换证书，换了就要在发版说明里告诉用户重新授权。
#
# 没配 secret 时：tag 触发或要创建 Release 的运行直接失败；只出工件的手动运行退回 ad-hoc 并警告。

name: client-release

on:
  push:
    tags:
      - 'client-v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否创建 GitHub Release（否则只产出构建工件）'
        type: boolean
        default: false

# 只给创建 Release 所需的写权限，其余保持只读。
# 不写这一块时用的是仓库的默认 token 权限：若仓库设为只读，最后一步会以 403
# 失败 —— 而那是在构建、签名、打包全部跑完之后，最贵的失败位置。
permissions:
  contents: write

env:
  # 由 cargo 从 crates.io 安装并校验，版本钉死。
  #
  # 名字**不能**以 RCODESIGN_ 开头。rcodesign 把所有 RCODESIGN_* 环境变量映射成
  # 自己的配置项，于是 RCODESIGN_VERSION 会被读成 default profile 里的 version，
  # 而 profile 只认 sign / remote-sign —— rcodesign 会在解析配置阶段就退出，
  # 报 UnknownField("version", ["sign", "remote-sign"])，根本走不到签名。
  APPLE_CODESIGN_VERSION: '0.29.0'

defaults:
  run:
    working-directory: tools/codex-relay-client

jobs:
  # macOS 包里的两个辅助程序，在 macOS runner 上准备好再交给 release：
  # - 微信读屏组件：Swift（ScreenCaptureKit + Vision），只能在 Mac 上编译。链接器会给 arm64
  #   产物加 ad-hoc 签名；打进 .app 后下面还会再签一次、再核验。
  # - context-filter 的 darwin-arm64 版：上游发布物，走下载地址而不是 api.github.com（后者按
  #   共享的 runner IP 限流），并对照上游 SHA256SUMS 校验。
  mac-reader:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 编译 macOS 微信读屏组件
        run: sh src/LanAi.RelayClient.WeChatReader.Mac/build.sh

      - name: 下载并校验 macOS 版 context-filter
        run: |
          version=$(tr -d '[:space:]' < bundled-context-filter/VERSION)
          base="https://github.com/LiangMu-Studio/context-filter/releases/download/$version"
          dir="$RUNNER_TEMP/context-filter-mac"
          mkdir -p "$dir" && cd "$dir"
          curl -fsSL --retry 3 -o context-filter-darwin-arm64.tar.gz "$base/context-filter-darwin-arm64.tar.gz"
          curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          grep ' context-filter-darwin-arm64.tar.gz$' SHA256SUMS | shasum -a 256 -c -
          tar -xzf context-filter-darwin-arm64.tar.gz
          found=$(find . -type f -name context-filter | head -n 1)
          if [ -z "$found" ]; then echo "::error::压缩包里没有 context-filter"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/mac-helpers"
          cp "$found" "$RUNNER_TEMP/mac-helpers/context-filter"
          file "$RUNNER_TEMP/mac-helpers/context-filter"

      # 两个文件放进同一个目录再上传：分处两个根目录时，upload-artifact 会按公共上级目录
      # 保留层级，下载后就不在 release 任务期待的位置了。
      - name: 汇总
        run: |
          cp src/LanAi.RelayClient.WeChatReader.Mac/.build/apple/Products/Release/wechat-reader "$RUNNER_TEMP/mac-helpers/wechat-reader"
          ls -la "$RUNNER_TEMP/mac-helpers"

      - uses: actions/upload-artifact@v4
        with:
          name: wechat-reader-mac
          path: ${{ runner.temp }}/mac-helpers/*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: mac-reader
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}

    # Read by fetch-context-filter.ps1. Not optional here: the Windows package is
    # refused below when the filter is missing, and anonymous api.github.com is rate
    # limited per (shared) runner IP — unauthenticated, a release would fail on
    # someone else's traffic.
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # -------------------------------------------------------------------
      # 发布前配置检查（§9.5.5）
      #
      # 这三条都是「发出去才发现」的静默事故：连本机地址的包不会报错，只会
      # 让用户看到「连不上服务器」。用 CI 挡住的成本远低于事后召回。
      # -------------------------------------------------------------------
      # ─────────────────────────────────────────────────────────────────
      # 发版后要更新的两处版本号（流水线不做，因为都在服务端）
      #
      # 1. 后台「客户端下载」设置里的 Windows / macOS 最新版本号
      #    —— 0.3 及以后的客户端读这里（/settings/public），改完立即生效。
      #
      # 2. frontend/public/client-version.json
      #    —— 只为 0.2 及更早的客户端保留。它们编译进去的更新检查只认这个
      #    路径，学不会新通道，所以这个文件是把老用户接上 0.3 的唯一桥。
      #    它 embed 进后端二进制，改它需要重新构建并部署（发 0.3 时本来就要）。
      #    等 0.2 基本消失后可以删掉，现在不行。
      #
      # 只更新其一的后果：漏了 1，新客户端永远不提示；漏了 2，所有 0.2
      # 用户永远停在 0.2。两种都不会报错。
      # ─────────────────────────────────────────────────────────────────
      - name: 读取版本号
        id: version
        shell: bash
        run: |
          version=$(grep -oE 'CurrentVersion = new\(([0-9]+), *([0-9]+)\)' \
            src/LanAi.RelayClient.Core/ClientOptions.cs \
            | grep -oE '[0-9]+, *[0-9]+' | tr -d ' ' | tr ',' '.')
          if [ -z "$version" ]; then
            echo "::error::无法从 ClientOptions.cs 读出版本号"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "客户端版本：$version"

      - name: tag 与客户端版本一致
        if: startsWith(github.ref, 'refs/tags/client-v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#client-v}"
          if [ "$tag_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag 是 $tag_version，而 ClientOptions.CurrentVersion 是 ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: 服务器地址不是占位符
        shell: bash
        run: |
          # 本机冒烟通道（#if LOCAL_SERVER）里合法地写着 127.0.0.1，正式发布不带
          # -p:LocalServer，编不进包里；所以只在这个块之外查。包本身的地址由下面的
          # check-server-address.py 在二进制上再验一遍。
          leftover=$(awk '/^#if LOCAL_SERVER/{skip=1;next} /^#(elif|else|endif)/{skip=0} !skip'             src/LanAi.RelayClient.Core/ClientOptions.cs | grep -n '127\.0\.0\.1' || true)
          if [ -n "$leftover" ]; then
            echo "::error::ClientOptions.cs 里还有 127.0.0.1（本机通道之外），这个包会连本机"
            echo "$leftover"
            exit 1
          fi

      - name: 测试
        run: |
          dotnet test LanAi.RelayClient.sln -c Release

      # -------------------------------------------------------------------
      # Windows 产物
      # -------------------------------------------------------------------
      - name: 发布 win-x64
        run: |
          dotnet publish src/LanAi.RelayClient.App/LanAi.RelayClient.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeWeChatReader=true `
            -o "${{ runner.temp }}/pub-win"

      # 发布渠道绝不能带上 TEST_SERVER。核在出货字节上而不是构建参数上：
      # 单文件包会把程序集打进 bundle，且 .NET 的字符串字面量是 UTF-16LE，
      # 普通 grep 找不到。
      - name: 核对出货字节里的服务器地址
        shell: bash
        run: |
          python packaging/check-server-address.py --channel production \
            "${{ runner.temp }}/pub-win/LanAi.RelayClient.App.exe"

      # 发布包必须带上 context-filter.exe。它在**构建**里是可选的
      # （EnsureBundledContextFilter 拿不到就只警告，好让离线开发机能编），
      # 但在**发布**里不是：少了它，出去的客户端「启用上下文压缩」永久置灰，
      # 而且没有任何报错——只有用户会发现自己的额度烧得比别人快。
      #
      # 在 context-filter\ 子目录下，不跟主 exe 平铺——App.axaml.cs 按
      # AppContext.BaseDirectory\context-filter\context-filter.exe 找它。
      - name: 发布包必须带上 context-filter
        shell: bash
        run: |
          if [ ! -f "${{ runner.temp }}/pub-win/context-filter/context-filter.exe" ]; then
            echo "::error::win-x64 发布目录里没有 context-filter\\context-filter.exe（fetch 步骤大概被限流或断网了），拒绝出包"
            ls -la "${{ runner.temp }}/pub-win"
            exit 1
          fi

      # 微信读屏组件同理：少了它「探索」页签整个不出现，也没有报错。它在 wechat-reader\
      # 子目录下（App.axaml.cs 按 AppContext.BaseDirectory\wechat-reader\wechat-reader.exe 找）。
      - name: 发布包必须带上微信读屏组件
        shell: bash
        run: |
          if [ ! -f "${{ runner.temp }}/pub-win/wechat-reader/wechat-reader.exe" ]; then
            echo "::error::win-x64 发布目录里没有 wechat-reader\\wechat-reader.exe（IncludeWeChatReader 没生效？），拒绝出包"
            ls -la "${{ runner.temp }}/pub-win"
            exit 1
          fi

      # zip 里要放齐用户解压后能直接跑的东西，不只是主 exe：
      # context-filter.exe 是 ExcludeFromSingleFile 的，必须放在它自己的
      # context-filter\ 子目录下（不是跟主 exe 平铺），发布产物已经是这个结构了，
      # 照搬即可。
      - name: 打包 Windows zip
        shell: pwsh
        run: |
          $out = "${{ runner.temp }}/artifacts"
          New-Item -ItemType Directory -Force $out | Out-Null
          $staging = Join-Path $out "win-staging"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "${{ runner.temp }}/pub-win/LanAi.RelayClient.App.exe" (Join-Path $staging "共飞-ChatGPT助手.exe")
          Copy-Item "${{ runner.temp }}/pub-win/context-filter" (Join-Path $staging "context-filter") -Recurse
          Copy-Item "${{ runner.temp }}/pub-win/wechat-reader" (Join-Path $staging "wechat-reader") -Recurse
          Copy-Item "${{ runner.temp }}/pub-win/codex-installer" $staging -Recurse
          Copy-Item "注册桌面和开始菜单快捷方式.cmd","删除桌面和开始菜单快捷方式.cmd" $staging
          Compress-Archive -Path (Join-Path $staging "*") `
            -DestinationPath (Join-Path $out "codex-relay-client_v${{ steps.version.outputs.version }}_x64.zip") `
            -CompressionLevel Optimal -Force
          Remove-Item $staging -Recurse -Force

      # -------------------------------------------------------------------
      # macOS 产物
      # -------------------------------------------------------------------
      # 上传工件会丢掉可执行位；build-app.py 按名字把 wechat-reader 标成 0755。
      - uses: actions/download-artifact@v4
        with:
          name: wechat-reader-mac
          path: ${{ runner.temp }}/wechat-reader-mac

      - name: 发布 osx-arm64
        run: |
          dotnet publish src/LanAi.RelayClient.App/LanAi.RelayClient.App.csproj `
            -c Release -r osx-arm64 --self-contained true `
            -p:IncludeWeChatReader=true `
            -p:WeChatReaderMacBinary="${{ runner.temp }}/wechat-reader-mac/wechat-reader" `
            -p:ContextFilterMacBinary="${{ runner.temp }}/wechat-reader-mac/context-filter" `
            -o "${{ runner.temp }}/pub-mac"

      - name: 生成图标
        shell: bash
        run: python packaging/macos/build-icns.py

      # 组装即断言：CFBundleExecutable 与 Contents/MacOS/ 下的文件必须同名，
      # 版本必须与 client-version.json 一致。两者写错都不会有任何提示 ——
      # 前者是双击 App 毫无反应，后者是永远劝用户升级到他已在跑的版本。
      #
      # 只组装、不打包：签名要发生在组装与归档之间。归档那一步没有 --allow-unsigned，
      # 所以漏签会在那里被拦下。
      - name: 组装 .app
        shell: bash
        run: |
          python packaging/macos/build-app.py \
            --publish "${{ runner.temp }}/pub-mac" \
            --out "${{ runner.temp }}/macos" \
            --assemble-only

      # 与 Windows 包同理：少了读屏组件 Mac 上「探索」页签整个不出现，少了 context-filter
      # 「启用上下文压缩」永久置灰，都没有报错。
      - name: .app 必须带上微信读屏组件与 context-filter
        shell: bash
        run: |
          macos="${{ runner.temp }}/macos/共飞-ChatGPT助手.app/Contents/MacOS"
          for helper in wechat-reader/wechat-reader context-filter/context-filter; do
            if [ ! -f "$macos/$helper" ]; then
              echo "::error::.app 里没有 Contents/MacOS/$helper，拒绝出包"
              ls -laR "$macos" | head -50
              exit 1
            fi
          done

      - name: 缓存 rcodesign
        id: cache-rcodesign
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rcodesign.exe
          key: rcodesign-${{ runner.os }}-${{ env.APPLE_CODESIGN_VERSION }}

      # 从 crates.io 源码安装：cargo 自带校验和验证，版本钉死，不需要人工核对
      # 二进制的 sha256。比下载 release 里的预编译包更容易说清来源。
      - name: 安装 rcodesign
        if: steps.cache-rcodesign.outputs.cache-hit != 'true'
        run: cargo install --locked --version ${{ env.APPLE_CODESIGN_VERSION }} apple-codesign

      # 强制步骤，不是可选优化（§8.2）。Apple Silicon 要求每个 arm64 可执行文件
      # 带签名，哪怕只是 ad-hoc；内核不警告，直接杀进程。而 .NET 从 Windows
      # 交叉编译时不会签名。
      # 读屏组件、context-filter 是 Contents/MacOS 下子目录里的另外两个 Mach-O：先单独签它们，
      # 再签整个 .app（后者把它们的签名封进 CodeResources）。不依赖 rcodesign 会不会自己找到嵌套的可执行文件。
      #
      # 用证书签时 rcodesign 自己写出指定要求（identifier + certificate root = H"…"，与 Apple
      # codesign 的默认一致），不需要另给 --code-requirements-file；下一步核对它。
      - name: 签名
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MUST_USE_CERT: ${{ startsWith(github.ref, 'refs/tags/client-v') || inputs.publish_release }}
        run: |
          app="${{ runner.temp }}/macos/共飞-ChatGPT助手.app"
          key_dir="$RUNNER_TEMP/macos-signing"
          trap 'rm -rf "$key_dir"' EXIT
          identity=()
          if [ -n "$P12_BASE64" ]; then
            if [ -z "$P12_PASSWORD" ]; then
              echo "::error::有 MACOS_SIGNING_P12_BASE64 却没有 MACOS_SIGNING_P12_PASSWORD"
              exit 1
            fi
            mkdir -p "$key_dir"
            printf '%s' "$P12_BASE64" | base64 -d > "$key_dir/signing.p12"
            printf '%s' "$P12_PASSWORD" > "$key_dir/password"
            identity=(--p12-file "$key_dir/signing.p12" --p12-password-file "$key_dir/password")
            echo "用固定证书签名"
          elif [ "$MUST_USE_CERT" = "true" ]; then
            echo "::error::没有配置 MACOS_SIGNING_P12_BASE64。正式发布必须用固定证书签，否则用户每次升级都要重新授权屏幕录制。见本文件开头与 packaging/macos/new-signing-cert.sh"
            exit 1
          else
            echo "::warning::没有配置签名证书，这个包是 ad-hoc 签名：装它的机器升级后要重新授权屏幕录制。只用于测试。"
          fi
          rcodesign sign "${identity[@]}" "$app/Contents/MacOS/wechat-reader/wechat-reader"
          rcodesign sign "${identity[@]}" "$app/Contents/MacOS/context-filter/context-filter"
          rcodesign sign "${identity[@]}" "$app"

      # 漏签的产物在 CI 里完全看不出来，只有到用户的机器上才会被内核杀掉。
      # 因此签完必须回头验一次，而不是相信上一步的退出码。
      - name: 核验签名
        shell: bash
        run: |
          app="${{ runner.temp }}/macos/共飞-ChatGPT助手.app"
          if [ ! -f "$app/Contents/_CodeSignature/CodeResources" ]; then
            echo "::error::签名后仍找不到 _CodeSignature/CodeResources"
            exit 1
          fi
          rcodesign print-signature-info "$app/Contents/MacOS/LanAi.RelayClient.App" \
            || { echo "::error::主可执行文件没有可读的签名"; exit 1; }
          rcodesign print-signature-info "$app/Contents/MacOS/wechat-reader/wechat-reader" \
            || { echo "::error::微信读屏组件没有可读的签名"; exit 1; }
          rcodesign print-signature-info "$app/Contents/MacOS/context-filter/context-filter" \
            || { echo "::error::context-filter 没有可读的签名"; exit 1; }

      # 授权能不能随升级保留，全看主程序的指定要求：必须是 Bundle ID + 仓库里那张证书的指纹。
      # 指纹不对（secret 换成了别的证书）或退回了 cdhash（没用上证书），用户升级后都会被要求重新授权，
      # 而这在出包时没有任何别的迹象。
      - name: 核对指定要求
        shell: bash
        env:
          HAS_CERT: ${{ secrets.MACOS_SIGNING_P12_BASE64 != '' }}
        run: |
          if [ "$HAS_CERT" != "true" ]; then
            echo "ad-hoc 签名，跳过"
            exit 0
          fi
          cert=packaging/macos/signing-cert.pem
          if [ ! -f "$cert" ]; then
            echo "::error::仓库里没有 $cert（new-signing-cert.sh 生成的公开证书），无法核对签名用的是不是那张证书"
            exit 1
          fi
          expected=$(openssl x509 -in "$cert" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')
          info=$(rcodesign print-signature-info "${{ runner.temp }}/macos/共飞-ChatGPT助手.app/Contents/MacOS/LanAi.RelayClient.App")
          designated=$(printf '%s\n' "$info" | grep 'designated' || true)
          echo "指定要求：$designated"
          want='(identifier "com.gongfeiai.chatgpt-assistant") and (certificate root = H"'"$expected"'")'
          case "$designated" in
            *"$want"*) echo "与 signing-cert.pem（$expected）一致" ;;
            *)
              echo "::error::主程序的指定要求不是 $want。secret 里的证书与仓库里的 signing-cert.pem 不是同一张？"
              exit 1
              ;;
          esac

      - name: 打包 .tar.gz
        shell: bash
        run: |
          python packaging/macos/build-app.py \
            --publish "${{ runner.temp }}/pub-mac" \
            --out "${{ runner.temp }}/macos" \
            --archive-only
          cp "${{ runner.temp }}/macos"/codex-relay-client_v*_macos-arm64.tar.gz \
             "${{ runner.temp }}/artifacts/"

      # 安装脚本要和包一起发布：它是用户拿到 mac 版的唯一入口，
      # 也是更新入口（客户端不自更新，重跑脚本就是升级）。
      - name: 附带安装与卸载脚本
        shell: bash
        run: |
          cp packaging/macos/install-mac.sh packaging/macos/uninstall-mac.sh \
             "${{ runner.temp }}/artifacts/"

      - name: 清单
        shell: bash
        run: ls -la "${{ runner.temp }}/artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: client-v${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/artifacts/*
          retention-days: 30
          if-no-files-found: error

  # 在真的 macOS 上用 Apple 的 codesign 再验一遍。上面的核验都是 rcodesign 在 Windows 上
  # 读自己写的签名；这里是用户机器上真正做判断的那一方。
  mac-verify:
    needs: release
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      # 只取公开证书，用来核对 Apple 读出来的指定要求。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/codex-relay-client/packaging/macos/signing-cert.pem
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: client-v${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/client

      # 工作目录用仓库根：没有 signing-cert.pem 时稀疏检出连 tools/codex-relay-client 都不会建。
      - name: codesign 核验
        working-directory: ${{ github.workspace }}
        env:
          HAS_CERT: ${{ secrets.MACOS_SIGNING_P12_BASE64 != '' }}
        run: |
          cert="$PWD/tools/codex-relay-client/packaging/macos/signing-cert.pem"
          cd "$RUNNER_TEMP/client"
          tar -xzf codex-relay-client_v*_macos-arm64.tar.gz
          app="共飞-ChatGPT助手.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for helper in wechat-reader/wechat-reader context-filter/context-filter; do
            codesign --verify --strict --verbose=2 "$app/Contents/MacOS/$helper"
          done
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Authority|Signature)=' || true
          requirement=$(codesign -d -r- "$app" 2>&1)
          echo "$requirement"
          if [ "$HAS_CERT" = "true" ]; then
            expected=$(openssl x509 -in "$cert" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')
            if ! printf '%s' "$requirement" | tr 'A-F' 'a-f' | grep -q "certificate root = h\"$expected\""; then
              echo "::error::codesign 读出的指定要求里没有 signing-cert.pem 的指纹 $expected"
              exit 1
            fi
          fi

  # -------------------------------------------------------------------
  # GitHub Release
  #
  # tag 触发时自动创建；手动触发时默认只留构建工件，避免误发。
  # 等 macOS 上的核验通过才建，签坏的包不会进草稿。
  # -------------------------------------------------------------------
  publish:
    needs: [release, mac-verify]
    if: startsWith(github.ref, 'refs/tags/client-v') || inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-v${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/artifacts/*
          draft: true
          name: 共飞-ChatGPT助手 v${{ needs.release.outputs.version }}
          body: |
            ## 安装

            **Windows**：下载 `codex-relay-client_v${{ needs.release.outputs.version }}_x64.zip`，解压后运行。

            **macOS（Apple 芯片）**：终端里执行

            ```
            curl -fsSL https://gongfeiai.com/install-mac.sh | bash
            ```

            重跑这条命令即可升级。卸载用 `uninstall-mac.sh`。

            > macOS 版本未经过公证（未购买开发者账号），因此用脚本安装而不是双击 .dmg——
            > 经浏览器下载的文件会被 Gatekeeper 拦截，而 curl 取回的不会。
            >
            > 从 1.0 起 macOS 版用固定证书签名。「探索」页读微信需要授权一次「屏幕录制」；从更早的版本
            > 升上来，第一次启动可能会问一次钥匙串「始终允许」。之后再升级，这两项都不会再问。
          fail_on_unmatched_files: true
