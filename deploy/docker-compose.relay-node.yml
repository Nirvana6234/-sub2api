# =============================================================================
# Sub2API 从节点（主从分流，NODE_ROLE=relay）Docker Compose
# =============================================================================
# 从节点不连数据库和 Redis，不走安装向导（NODE_ROLE=relay 时程序直接进入从节点流程，AUTO_SETUP
# 不会被读取），也不提供管理后台、登录和内嵌前端；对外只开 HTTPS。完整步骤见 docs/RELAY_NODE_OPS.md。
#
# 用法：
#   1. cp relay-node.env.example relay-node.env，填主节点地址和根证书指纹（管理页"从节点管理"里复制）
#   2. docker compose -f docker-compose.relay-node.yml --env-file relay-node.env up -d
#   3. docker compose -f docker-compose.relay-node.yml logs sub2api-relay | grep fingerprint
#      读出本机的身份指纹，到后台"从节点管理 → 节点"里核对后激活
#
# 必须持久保存的东西都在 relay_node_data 卷里（identity/ 长期密钥、certs/ HTTPS 证书缓存、
# 本地扣费队列、日志和记录）：长期密钥丢了会变成一台新节点，要重新激活；证书缓存丢了每次重建都要
# 重新申请证书，容易撞上 Let's Encrypt 的签发次数限制。
# =============================================================================

services:
  sub2api-relay:
    image: ${SUB2API_IMAGE:-weishaw/sub2api:latest}
    container_name: sub2api-relay
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    # 对外只开 443（HTTPS，证书用 TLS-ALPN-01 申请，不需要 80 端口）。不要映射 8080。
    ports:
      - "443:443"
    sysctls:
      # 容器里的非 root 用户要监听 443
      - net.ipv4.ip_unprivileged_port_start=0
    volumes:
      - relay_node_data:/app/data
    environment:
      - NODE_ROLE=relay
      # 不走安装向导、不写配置文件
      - AUTO_SETUP=false
      - SERVER_MODE=release
      - TZ=${TZ:-Asia/Shanghai}

      # ---- 从节点本机只需要这三项（其余配置全部由主节点下发）----
      # 主节点主从通信地址（host:port，主节点的 relay.master_listen_addr 对外地址，直连，不经 CDN 或会解密的代理）
      - RELAY_NODE_MASTER_ADDR=${RELAY_NODE_MASTER_ADDR:?RELAY_NODE_MASTER_ADDR is required}
      # 主从通信根证书指纹，多个用逗号分隔（轮换根证书时同时写新旧两个）
      - RELAY_NODE_ROOT_FINGERPRINTS=${RELAY_NODE_ROOT_FINGERPRINTS:?RELAY_NODE_ROOT_FINGERPRINTS is required}
      # 主节点对外的 HTTP 地址：还不能经从节点处理的请求原样交给它转发
      - RELAY_NODE_MASTER_URL=${RELAY_NODE_MASTER_URL:?RELAY_NODE_MASTER_URL is required}
      - RELAY_NODE_DISPLAY_NAME=${RELAY_NODE_DISPLAY_NAME:-}

      # ---- HTTPS ----
      - RELAY_NODE_TLS_ADDR=:443
      - RELAY_NODE_ACME_EMAIL=${RELAY_NODE_ACME_EMAIL:-}
      # 申请不到证书时，在卷里放证书文件并取消下面两行注释（优先于自动申请，换了文件自动重读）
      # - RELAY_NODE_CERT_FILE=/app/data/tls/fullchain.pem
      # - RELAY_NODE_KEY_FILE=/app/data/tls/privkey.pem

      # ---- 服务器参数（与主节点同一组；推荐值见 docs/RELAY_NODE_OPS.md 第 8 节）----
      - SERVER_READ_HEADER_TIMEOUT=${SERVER_READ_HEADER_TIMEOUT:-10}
      - SERVER_MAX_HEADER_BYTES=${SERVER_MAX_HEADER_BYTES:-65536}
      - SERVER_IDLE_TIMEOUT=${SERVER_IDLE_TIMEOUT:-120}

      # 从节点不会自动更新：升级按手册"排空 → 换镜像 → 恢复"
    healthcheck:
      # 从节点只有 HTTPS 且证书按域名签发，容器内用 TCP 探活；对外健康由主节点的外部探测负责
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - relay-node-network

volumes:
  relay_node_data:
    driver: local

networks:
  relay-node-network:
    driver: bridge
