// 主从节点通信协议（docs/MASTER_RELAY_NODES.md 第 7 节，开发计划 2.3）。
//
// 连接按优先级分开（控制 / 事件 / 扣费 / 审核 / 日志），每类连接只调用对应的
// service。业务消息由后续工作包逐步加入：
//   - 新增 RPC 只加不改；
//   - 事件流的信封用 oneof，字段号按下面的保留区间分配，老版本收到不认识的类型
//     会忽略，不会出错。
//
// 生成：internal/relay/proto/generate.sh（不要手改生成代码）。
syntax = "proto3";

package sub2api.relay.v1;

option go_package = "github.com/Wei-Shaw/sub2api/internal/relay/proto/relayv1;relayv1";

// 接入：握手、注册、证书续签与恢复（WP3）。允许未签发证书的对端调用，
// 各 RPC 允许的对端类型见 internal/relay/transport 的访问策略。
service RelayEnrollment {
  // Hello 返回主节点纪元、协议版本范围，以及主节点眼中这个对端的类型。
  rpc Hello(HelloRequest) returns (HelloResponse);
  // Register 登记一台新节点（设计 11.1）。必须用长期密钥自签的证书握手：节点身份
  // 就是这把密钥的指纹，由 TLS 证明持有，不信消息里报的值。重复注册是幂等的。
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // NodeStatus 查询这把长期密钥对应节点的状态，同时是待激活期间的心跳（设计 11.2）。
  rpc NodeStatus(NodeStatusRequest) returns (NodeStatusResponse);
  // ObtainCertificate 已激活节点用长期密钥领取主从通信证书：激活后第一次、
  // 重启后手里没有有效证书、证书过期后的恢复（设计 7.2 第 4 条）。
  rpc ObtainCertificate(CertificateRequest) returns (CertificateResponse);
  // RenewCertificate 用当前签发证书续签，同时换新的 TLS 密钥和加密密钥（设计 7.2 第 1 条）。
  rpc RenewCertificate(CertificateRequest) returns (CertificateResponse);
}

// 控制连接：选号、上游错误决策、额度、Key 查询等同步小消息（WP6、WP7、WP11）。
service RelayControl {
  rpc Ping(PingRequest) returns (PingResponse);
  // FetchConfig 拉取本节点的配置快照（启动、重连、纪元变化、版本落后时，设计 6.2）。
  rpc FetchConfig(FetchConfigRequest) returns (ConfigSnapshot);

  // ---- 额度（设计第 4 节）。申请随选号一起（WP7），这里是退回、续期、核对、收回确认。----
  // 这几个调用都动钱：必须带当前纪元，跨纪元一律拒绝（EPOCH_MISMATCH）；从节点先上报租约
  // （ReportLeases），再用同样的数值重发，不清零。
  // 退回类消息带"这份租约至今累计退回"而不是增量；主节点把累计记在租约上（持久化），只处理多出来的
  // 部分，重发、回复丢失、主节点重启后再发都只生效一次。
  rpc ReleaseQuota(ReleaseQuotaRequest) returns (ReleaseQuotaResponse);
  rpc RenewLeases(RenewLeasesRequest) returns (RenewLeasesResponse);
  // ReportLeases 重连或纪元变化后上报手里的租约：主节点关掉没上报的，告诉节点哪些已作废。
  // 上报完成之前从节点不发选号。
  rpc ReportLeases(ReportLeasesRequest) returns (ReportLeasesResponse);
  rpc AckQuotaRecall(AckQuotaRecallRequest) returns (AckQuotaRecallResponse);

  // ---- 准入与选号（设计 3.1 第 5 步、3.2，开发计划 WP7、WP9）----
  // Admit 按本地网关中间件链复查一个 API Key 请求（全局黑名单、Key 鉴权与计费检查、未分组拦截；
  // 分组模型白名单除外：从节点用回复里分组的白名单在本地跑同一个中间件），通过时回 Key 快照，
  // 从节点据此运行处理函数里选号之前的步骤。只读，不带幂等键；选号时主节点仍然独立复查。
  rpc Admit(AdmitRequest) returns (AdmitResponse);
  // ResolveRoute 按模型定这次请求的走向（本地 autoGroupModelRouting、compositeTarget 两个中间件，设计 3.2）：
  // 自动分组 Key 按模型选分组，组合平台分组按模型选目标平台和上游模型。准入之后、从节点读出请求体里的模型再调
  // （本地这两个中间件也在鉴权之后、读请求体时才做）。不带幂等键：自动分组的选组记在主节点（与本地同一个选组器），
  // 重发只会得到同一个或按同样规则的选择；组合平台选目标只读，选号时主节点按同样的输入再选一次。
  rpc ResolveRoute(ResolveRouteRequest) returns (ResolveRouteResponse);
  // SwitchAutoGroup 自动分组 Key 在一次请求里换到下一个候选分组（本地 tryOpenAIAutoGroupFailover）：当前分组选不出
  // 账号或换号用完时从节点调。主节点把当前分组记为失败，按同一个选组器选下一个这次请求没试过的候选。
  // 不幂等（会记失败、改选组状态）：超时不重发，按"没换"处理。
  rpc SwitchAutoGroup(SwitchAutoGroupRequest) returns (SwitchAutoGroupResponse);
  // ReportAutoGroupResult 自动分组 Key 一次请求的最终结果（本地自动分组中间件在请求结束时的观察）：主节点据此
  // 调整之后的选组（首字慢、失败时换组）。从节点在后台发，失败不重试。
  rpc ReportAutoGroupResult(AutoGroupResult) returns (AutoGroupResultAck);
  // UserMsgQueue 用户消息串行队列的一步（锁、上次完成时间、Redis 时钟、账号当前 RPM，都在主节点的 Redis）：从节点的
  // 处理函数照本地同一段排队代码（含排队期间的 SSE 保活），每一步在主节点执行。只认这台节点正在用的账号。
  rpc UserMsgQueue(UserMsgQueueRequest) returns (UserMsgQueueResponse);
  // Select 为一次客户端请求的一次尝试选号：主节点复查凭据、做只有它能做的检查、选号、占并发槽，
  // 签发扣费凭证，需要时顺带补充额度。带幂等键（请求 ID + 第几次选号）：超时重发拿到同一个结果。
  // 被拒绝时正常返回 rejection（不是 gRPC 错误），从节点按它写客户端响应。
  rpc Select(SelectRequest) returns (SelectResponse);
  // FetchCredentials 取一次进行中的选号所选账号的上游凭据：从节点缓存里没有这个版本时用（设计 9.1）。
  // 只有这次选号还没释放、且账号就是它选中的，主节点才给。
  rpc FetchCredentials(FetchCredentialsRequest) returns (FetchCredentialsResponse);
  // RefillQuota 按一次进行中的选号补充额度（提前补充，设计 4.2）：主节点按这次选号的用户、Key、
  // 分组、订阅重新算剩余；选号已释放时拒绝。
  rpc RefillQuota(RefillQuotaRequest) returns (RefillQuotaResponse);
  // UpstreamError 上游错误决策（设计 3.1 第 10 步）：从节点转发遇到上游错误时同步调用，主节点用
  // 单机同一段代码判定并记录账号状态（限流、临时不可调度、停用、冷却），返回判定结果。
  // 只能针对这台节点正在用的账号（有进行中的选号）。
  rpc UpstreamError(UpstreamErrorRequest) returns (UpstreamErrorResponse);
  // ---- Responses WebSocket（开发计划 WP10-3）----
  // BeginTurn 一条 WebSocket 连接的一轮开始时同步调用：按当时的利润门复核这次选号的账号、冻结这一轮的计价时间、
  // 补占这一轮的用户槽和账号槽（不排队）、按这一轮的模型签凭证，尽量补充额度（额度不够也不拒绝：单机只在建连时
  // 查计费资格）。复核不过或占不到槽时回 close，从节点按它关闭连接。
  rpc BeginTurn(BeginTurnRequest) returns (BeginTurnResponse);
  // TurnMapping 一轮的渠道映射（这一轮换了模型时，按模型缓存）。选号必须是这台节点进行中的。
  rpc TurnMapping(TurnMappingRequest) returns (TurnMappingResponse);
  // WebSocketLease 每个 Key 的 WebSocket 连接数租约（Redis 里的全局租约，主节点代为申请、续期、释放；
  // 上限用主节点的配置）。租约按节点记归属，别的节点不能续期或释放。
  rpc WebSocketLease(WebSocketLeaseRequest) returns (WebSocketLeaseResponse);

  // CyberPolicyHit 上游判定 cyber 策略后调用（设计 3.4）：主节点写会话屏蔽标记（同步，属于授权），用单机同一段
  // 代码（handler.CyberPolicyRecorder）；风控记录、运维日志由从节点写本机。用户、Key、分组、账号取自这次选号的
  // 记录，屏蔽的键由选号时上送的查询键推导；每次请求只记一次。选号必须是这台节点进行中的。
  rpc CyberPolicyHit(CyberPolicyHitRequest) returns (CyberPolicyHitResponse);

  // ---- 内容审核命中后的账号动作（设计 3.4）：判定和记录在从节点，违规次数跨节点累计、封号、邮件在主节点 ----
  // ModerationViolation 从节点写一条计入封号的审核记录之前调用：主节点用单机同一段代码累计窗口内违规次数、
  // 按阈值封号，并记一条不含输入内容的违规记录（带节点）。只认这台节点最近准入过的用户。带幂等键。
  rpc ModerationViolation(ModerationViolationRequest) returns (ModerationViolationResponse);
  // ModerationNotify 命中与封号通知邮件（SMTP 不下发，由主节点发）。收件人按主节点库里的用户。
  rpc ModerationNotify(ModerationNotifyRequest) returns (ModerationNotifyResponse);
  // FetchFlaggedHashes 分页拉取命中过的输入名单（从节点每次连上事件流后整份拉一次，之后按增量更新）。
  rpc FetchFlaggedHashes(FetchFlaggedHashesRequest) returns (FetchFlaggedHashesResponse);
  // RecordFlaggedHash 从节点新命中的输入：主节点写进名单，再把增量推给所有节点。
  rpc RecordFlaggedHash(RecordFlaggedHashRequest) returns (RecordFlaggedHashResponse);

  // ReportWebSearchUsage 联网搜索用量（设计 3.3）：搜索在从节点执行，各搜索服务的配额是全局的。从节点定期报
  // 上次确认以来新用的次数，主节点加进全局计数，回每个服务当前的上限、已用和这台可用的份额（剩余按在线节点分摊）。
  // 带幂等键：回复丢了重发同一份，只加一次。
  rpc ReportWebSearchUsage(WebSearchUsageReport) returns (WebSearchUsageShares);
}

// 扣费连接：扣费批次（设计 5.1、5.2，开发计划 WP8）。
service RelayBilling {
  // SubmitUsage 提交一批扣费记录。主节点逐条入账、逐条回结果；每条按扣费凭证去重，重发只入账一次，
  // 所以一批没收到确认时整批重发即可。结果是 RETRY 的记录稍后再发，REJECTED 的不要再发。
  rpc SubmitUsage(UsageBatch) returns (UsageBatchAck);
}

// 事件连接：一条长期双向流，承载心跳、释放、账号事件，以及主节点下发的指令。
service RelayEvents {
  rpc Stream(stream NodeEnvelope) returns (stream MasterEnvelope);
}

// 对端类型，与 transport.PeerClass 一一对应。
enum PeerClass {
  PEER_CLASS_UNSPECIFIED = 0;
  // 没有出示证书（只能注册）。
  PEER_CLASS_ANONYMOUS = 1;
  // 用从节点长期密钥自签的证书（待激活、证书过期后的恢复）。
  PEER_CLASS_LONG_TERM = 2;
  // 主节点签发的主从通信证书（已激活节点的正常通信）。
  PEER_CLASS_ISSUED = 3;
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message HelloRequest {
  ProtocolVersion version = 1;
  string program_version = 2;
}

message HelloResponse {
  string master_epoch = 1;
  ProtocolVersion min_supported = 2;
  ProtocolVersion current = 3;
  PeerClass peer_class = 4;
  // 签发证书的对端：证书里的节点 ID。其他类型为 0。
  int64 node_id = 5;
  // 主节点当前时间（Unix 毫秒），用于测时钟偏差（设计 7.4）。
  int64 master_time_unix_ms = 6;
}

// 节点状态，与 relay_nodes.status 对应。
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  // 这把长期密钥没有注册过（或已被清除）。
  NODE_STATUS_UNKNOWN = 1;
  NODE_STATUS_PENDING = 2;
  NODE_STATUS_ACTIVE = 3;
  NODE_STATUS_DRAINING = 4;
  NODE_STATUS_DISABLED = 5;
  NODE_STATUS_REJECTED = 6;
}

message RegisterRequest {
  string hostname = 1;
  string program_version = 2;
  map<string, string> system_info = 3;
  string display_name = 4;
}

message RegisterResponse {
  NodeStatus status = 1;
  // 主节点算出的长期密钥指纹，从节点把它和本机打印的对一下。
  string key_fingerprint = 2;
  // 全部未停用的主从通信根证书指纹（含预备中的），从节点用它替换本机存下的列表（设计 7.4）。
  repeated string root_fingerprints = 3;
}

message NodeStatusRequest {
  string program_version = 1;
}

message NodeStatusResponse {
  NodeStatus status = 1;
  int64 heartbeat_interval_ms = 2;
  string key_fingerprint = 3;
  // 同 RegisterResponse.root_fingerprints：待激活、已停用的节点靠心跳拿到预备中的新根。
  repeated string root_fingerprints = 4;
}

message CertificateRequest {
  // 新的 TLS 公钥（PKIX DER，Ed25519）。私钥只在从节点本机。
  bytes tls_public_key = 1;
  // 新的加密公钥（X25519，32 字节），用于上游凭据的二次加密（设计 7.1 第 4 条）。
  bytes encryption_public_key = 2;
}

message CertificateResponse {
  // 签发的证书（DER）。
  bytes certificate = 1;
  int64 not_after_unix_ms = 2;
  int64 node_id = 3;
  // 同 RegisterResponse.root_fingerprints。
  repeated string root_fingerprints = 4;
}

message PingRequest {
  bytes payload = 1;
}

message PingResponse {
  bytes payload = 1;
  int64 master_time_unix_ms = 2;
}

// 从节点 → 主节点的事件信封。
// 字段号：1~9 信封本身；10~99 从节点上报的事件；100~199 对主节点指令的回执；
// 200 起留给以后。
message NodeEnvelope {
  uint64 seq = 1;
  oneof body {
    EventPing ping = 10;
    SelectionRelease selection_release = 11;
    AccountEvent account_event = 12;
  }
}

message FetchConfigRequest {
  // 从节点手里的版本；与当前一致时只回 unchanged。
  string known_version = 1;
}

// 配置快照（设计 6 第二类、11.3）。版本是内容哈希：内容相同版本就相同，
// 主节点重启后也一致；从节点只比较是否相等。
message ConfigSnapshot {
  string version = 1;
  bool unchanged = 2;
  // 按白名单下发的系统设置。白名单外的设置在从节点上读到空值；不含任何密钥。
  map<string, string> settings = 3;
  // 其他配置分段（错误透传规则、TLS 指纹等，内容为 JSON），由主节点按需登记。
  map<string, bytes> sections = 4;
  // 本节点配置与主从分流通用配置（JSON）。
  bytes node_config = 5;
  // 主从通信根证书指纹（含轮换中的新根），从节点据此更新固定的指纹。
  repeated string root_fingerprints = 6;
  // 验中转票据的公钥（全部未停用的版本，含预备中的，设计 8.1）。
  // 扣费凭证只在主节点验，公钥不下发。
  repeated SigningPublicKey ticket_public_keys = 7;
  // 按节点加密下发的部分（设计 6 第二类）：转发功能要用的密钥（审核、联网搜索配置及其引用的代理），
  // 用这台节点的加密公钥封（sealbox，附加数据绑定节点 ID 和版本）；明文是 SealedPayload 的 JSON。
  bytes sealed = 8;
}

// 配置变了，从节点拉取新版本。
message ConfigChanged {
  string version = 1;
}

// 缓存作废（设计 6 第三类）。收到后从节点清掉对应缓存，下一个请求重新向主节点查询。
message Invalidation {
  // API Key 鉴权缓存键：原始 Key 的 SHA-256（十六进制）。新建 Key 也会发，
  // 用来清掉"查不到"的负缓存。
  repeated string api_key_hashes = 1;
  repeated int64 user_ids = 2;
  repeated int64 group_ids = 3;
}

// 主节点 → 从节点的事件信封。
// 字段号：1~9 信封本身；10~99 主节点指令；100~199 对从节点事件的回执；200 起留给以后。
message MasterEnvelope {
  uint64 seq = 1;
  oneof body {
    EventPing ping = 10;
    ConfigChanged config_changed = 11;
    Invalidation invalidation = 12;
    TicketRevocations ticket_revocations = 13;
    QuotaRecall quota_recall = 14;
    FlaggedHashes flagged_hashes = 15;
  }
}

// 命中过的输入名单的增量（设计 3.4）：主节点的 Redis 名单是权威，每台从节点保留一份副本。
message FlaggedHashes {
  repeated string added = 1;
  repeated string removed = 2;
  // 后台清空了名单（先于 added 生效）。
  bool cleared = 3;
}

message EventPing {
  bytes payload = 1;
}

// ---- 签名（开发计划 WP5，internal/relay/sign）----

// 签名信封：payload 是 Ticket 或 Voucher 的 protobuf 编码，按收到的原始字节验签。
// 签名 = Ed25519(私钥, 用途串 || 0x00 || payload)，用途串区分票据和凭证，一种不能冒充另一种。
message SignedToken {
  // 签名密钥版本（keystore 的版本号）。
  uint32 key_version = 1;
  bytes payload = 2;
  bytes signature = 3;
}

message SigningPublicKey {
  uint32 version = 1;
  // Ed25519 公钥，32 字节。
  bytes public_key = 2;
}

// 中转票据（设计 8.1）：小白端访问分配的从节点用，10 分钟有效。
message Ticket {
  int64 user_id = 1;
  // 只能在这台从节点上用。
  int64 node_id = 2;
  // 签发时用户的 token_version（由邮箱和密码哈希推导）。主节点选号时和当前值比对，
  // 改密码、改邮箱后旧票据在下一个请求被拒，和登录态一致。
  int64 token_version = 3;
  int64 issued_at_unix_ms = 4;
  int64 expires_at_unix_ms = 5;
}

// 计费模式（设计 5.3）。
enum BillingMode {
  BILLING_MODE_UNSPECIFIED = 0;
  BILLING_MODE_BALANCE = 1;
  BILLING_MODE_SUBSCRIPTION = 2;
}

// 扣费凭证（设计 5.3）：主节点每次选号签发一张，从节点上报扣费记录时原样带回，主节点验签后才入账。
message Voucher {
  // UUID（16 字节）；与 issued_at 一起是 relay_voucher_consumed 的主键，每张只入账一次。
  bytes voucher_id = 1;
  int64 issued_at_unix_ms = 2;
  // 只能由这台从节点上报（入账时核对，WP8）。
  int64 node_id = 3;
  string selection_id = 4;
  int64 user_id = 5;
  int64 api_key_id = 6;
  int64 account_id = 7;
  int64 group_id = 8;
  BillingMode billing_mode = 9;
  string requested_model = 10;
  // 上报的实际模型必须在这里面，否则按请求模型计费并报警（设计 5.3）。
  repeated string allowed_billing_models = 11;
  Quote quote = 12;
  SelectionContext context = 13;
}

// 报价：签发时的计价输入，入账按它计价（设计 5.3、6 第一类）。
// 字段随 WP8 的"按报价计价"一起补（要补哪些见 relayselect 的字段守卫）。金额用整数微单位（1 = 10⁻⁸），
// 单价按每百万 token 表示（按每 token 会出现小数，比如 0.075 美元每百万 token）。
message Quote {
}

// 选号上下文：入账要用、由选号决定的值，入账前原样恢复（设计 5.3）。清单由 relayselect 的字段守卫维护：
// 入账输入、账号的请求级字段、入账 ctx 搬运的值，每一项都要归类，新增时守卫测试失败。
message SelectionContext {
  // 计价时间（openai_profit_control 的 pricingAt）。
  int64 pricing_at_unix_ms = 1;
  // 用户 × 平台配额的计量平台（QuotaPlatform，组合平台、ForcePlatform 解析后）。
  string quota_platform = 2;
  // 订阅（订阅计费时）。
  int64 subscription_id = 3;
  // 渠道映射（ChannelUsageFields 里由主节点定下的部分；映射链由入账时按上游模型重新生成）。
  int64 channel_id = 4;
  string channel_mapped_model = 5;
  string billing_model_source = 6;
  // 分组兜底池（usage_log 的 fallback_*）。
  int64 fallback_source_group_id = 7;
  string fallback_source_group_name = 8;
  int64 fallback_target_group_id = 9;
  string fallback_target_group_name = 10;
  // 贡献房间路由（账号上只对这一次请求有效的字段，影响计费倍率）。
  string contribution_route_source = 11;
  int64 contribution_room_id = 12;
  bool has_contribution_rate_multiplier_override = 13;
  double contribution_rate_multiplier_override = 14;
  // 渠道是否做了映射（channel_mapped_model 在没映射时等于请求模型）。
  bool channel_mapped = 15;
}

// 票据吊销（设计 8.1）：这些用户在 revoked_before 及之前签发的票据作废。
// 从节点只拿它提前拒绝；以主节点选号时的复查为准。
message TicketRevocations {
  repeated RevokedTicketUser users = 1;
}

message RevokedTicketUser {
  int64 user_id = 1;
  int64 revoked_before_unix_ms = 2;
}

// ---- 额度（设计第 4 节，开发计划 WP6）。金额都是整数微单位（1 = 10⁻⁸）。----

message QuotaScope {
  string dimension = 1;
  // 订阅窗口为分组 ID，Key 维度为 API Key ID，其余为 0。
  int64 scope_id = 2;
  // 平台配额为平台名，其余为空。
  string scope_key = 3;
}

// 主节点给出的一项额度（随选号回复下发，WP7）。
message QuotaGrant {
  int64 lease_id = 1;
  int64 user_id = 2;
  QuotaScope scope = 3;
  // 这次新给的。
  int64 amount = 4;
  // 这份租约现在总共锁着的（含节点已用、未入账的）。
  int64 granted = 5;
  int64 expires_at_unix_ms = 6;
}

// 一份租约的退回：这份租约至今累计退回了多少（不是增量，跨纪元也不清零）。
// closed 表示节点放弃整份租约（剩下的全部退回）。
message LeaseReturn {
  int64 lease_id = 1;
  int64 user_id = 2;
  int64 returned_total = 3;
  bool closed = 4;
}

message ReleaseQuotaRequest {
  repeated LeaseReturn returns = 1;
}

message ReleaseQuotaResponse {
  // 主节点已不认的租约（已关闭、已作废）：节点立即丢弃，不再使用。
  repeated int64 dropped_lease_ids = 1;
}

message LeaseRenewal {
  int64 lease_id = 1;
  int64 user_id = 2;
  // 最后一次用这份额度的时间（闲置判断，设计 4.4）；没用过为 0。
  int64 last_used_at_unix_ms = 3;
}

message RenewLeasesRequest {
  repeated LeaseRenewal leases = 1;
}

message RenewedLease {
  int64 lease_id = 1;
  int64 expires_at_unix_ms = 2;
}

message RenewLeasesResponse {
  repeated RenewedLease renewed = 1;
  repeated int64 dropped_lease_ids = 2;
}

message HeldLease {
  int64 lease_id = 1;
  int64 user_id = 2;
}

message ReportLeasesRequest {
  repeated HeldLease leases = 1;
}

message ReportLeasesResponse {
  repeated int64 dropped_lease_ids = 1;
}

// 主节点要求收回某个用户的一项子额度（设计 4.2、4.4）。idle_only 时只收回闲置的。
message QuotaRecall {
  string recall_id = 1;
  int64 user_id = 2;
  QuotaScope scope = 3;
  bool idle_only = 4;
}

message AckQuotaRecallRequest {
  string recall_id = 1;
  repeated LeaseReturn returns = 2;
}

message AckQuotaRecallResponse {
  repeated int64 dropped_lease_ids = 1;
}

// ---- 选号（开发计划 WP7）----
// 选号的入口类型：决定主节点复用哪一套本地选号流程（WP7 按入口逐个接入）。
enum SelectEndpoint {
  SELECT_ENDPOINT_UNSPECIFIED = 0;
  // OpenAI Responses（/v1/responses 及别名、/responses/compact）。
  SELECT_ENDPOINT_OPENAI_RESPONSES = 1;
  // OpenAI Chat Completions。
  SELECT_ENDPOINT_OPENAI_CHAT = 2;
  // OpenAI 分组的 Anthropic Messages（/v1/messages，按 Chat Completions 能力选号，错误按 Anthropic 格式）。
  SELECT_ENDPOINT_OPENAI_MESSAGES = 3;
  // Responses WebSocket 的连接选号（第一次：建连；之后：连接内换号）。选中的账号绑定这条连接，
  // 每一轮用 BeginTurn 签凭证；回复不带凭证。拒绝按 WebSocket 关闭码（REJECTION_FORMAT_WS_CLOSE）。
  SELECT_ENDPOINT_OPENAI_RESPONSES_WS = 4;
  // Anthropic Messages（GatewayHandler.Messages 的主循环：Anthropic 分组的 /v1/messages）。选号与准入一次只做一轮
  // （handler.AnthropicAccountAdmitter）：换号状态（已失败的账号、利润否决次数、选号耗尽后的退避）在从节点的
  // 处理函数里，与单机同一段代码；主节点按从节点带来的已排除账号选，不累计。
  SELECT_ENDPOINT_ANTHROPIC_MESSAGES = 5;
  // Anthropic 的 /v1/messages/count_tokens（GatewayHandler.CountTokens）：计费资格检查后按模型选一个账号，不占槽、
  // 不计费（没有凭证、不给额度）；上游没服务时释放放掉会话数注册。
  SELECT_ENDPOINT_ANTHROPIC_COUNT_TOKENS = 6;
}

message AdmitRequest {
  oneof credential {
    string api_key = 1;
  }
  string client_ip = 2;
  string method = 3;
  string path = 4;
}

message AdmitResponse {
  oneof result {
    Admission admission = 1;
    // REJECTION_FORMAT_RAW（中间件写出的响应）或 REJECTION_FORMAT_UNSUPPORTED（交给主节点转发）。
    SelectRejection rejection = 2;
  }
}

// 准入通过：Key 快照（internal/relay/keycodec 按白名单编码的 JSON；用户只带转发要用的字段，
// 不含邮箱、密码哈希、余额等）。
message Admission {
  bytes api_key = 1;
  // 订阅（订阅计费分组时），同样按白名单编码；没有时为空。
  bytes subscription = 2;
  // 3 曾是安全审计策略（审计改在从节点本地判定后不再需要）。
  reserved 3;
}

message ResolveRouteRequest {
  string api_key = 1;
  string client_ip = 2;
  string method = 3;
  string path = 4;
  // 请求体里的模型（按路由取，与本地中间件同一段代码）。
  string model = 5;
  // 自动分组 Key 这次请求已定下的分组（非 0 时主节点核对它是这把 Key 的候选再用，不重新选；0 时按 model 选）。
  int64 auto_group_id = 6;
}

message ResolveRouteResponse {
  oneof result {
    RouteResolution resolution = 1;
    // Key 复查不通过（原样响应）或这条路还不能经从节点（交给主节点）。
    SelectRejection rejection = 2;
  }
}

message RouteResolution {
  // 组合平台分组按模型选定的走向（service.CompositeRouteDecision 的 JSON；没匹配时 matched 为 false）。
  bytes composite_decision = 1;
  // 自动分组 Key：按模型选定分组后的 Key 快照与订阅（keycodec 编码；不是自动分组 Key 时为空）。
  bytes api_key = 2;
  bytes subscription = 3;
}

message SwitchAutoGroupRequest {
  string api_key = 1;
  string client_ip = 2;
  string method = 3;
  string path = 4;
  // 选组用的模型（本地处理函数的请求模型）。
  string model = 5;
  // 要切走的当前分组；failed_group_ids 是这次请求里已经失败过的分组（含当前分组）。
  int64 current_group_id = 6;
  repeated int64 failed_group_ids = 7;
  // 换组后的计费资格复查用（同 SelectRequest.held_quota）。
  repeated HeldQuota held_quota = 8;
}

message SwitchAutoGroupResponse {
  // switched 为 false：没有可换的候选（从节点按原来的错误写响应）。
  bool switched = 1;
  // 切到的分组的 Key 快照与订阅（keycodec 编码）。
  bytes api_key = 2;
  bytes subscription = 3;
  // 换到的分组计费资格复查不过（本地在"换号用完后换组"时复查）：状态码、错误类型、文案、Retry-After
  // （GATEWAY 格式），从节点在本地复查的那一处按本地的写法写出。
  SelectRejection billing_rejection = 4;
}

message AutoGroupResult {
  string api_key = 1;
  // 选组用的模型（与 ResolveRoute 的 model 相同）。
  string model = 2;
  // 请求结束时用的分组（中途切过分组的是切到的那个）。
  int64 group_id = 3;
  // 观察到的状态码（本地同一段算法：处理函数写的状态、流内错误的本意状态、失败时上游的原始状态）。
  int32 status = 4;
  // 首字耗时（毫秒）；has_first_token_ms 为 false 时没有。
  bool has_first_token_ms = 5;
  int64 first_token_ms = 6;
}

message AutoGroupResultAck {}

message UserMsgQueueRequest {
  enum Op {
    OP_UNSPECIFIED = 0;
    // 试着拿账号的串行锁（request_id、lock_ttl_ms）：value 为 1 表示拿到。
    OP_ACQUIRE = 1;
    // 放锁并记下完成时间（request_id）：value 为 1 表示放了。
    OP_RELEASE = 2;
    // 上次完成时间（毫秒，Redis 时钟）。
    OP_LAST_COMPLETED_MS = 3;
    // Redis 当前时间（毫秒）。
    OP_NOW_MS = 4;
    // 账号当前这一分钟的 RPM 计数。
    OP_ACCOUNT_RPM = 5;
  }
  Op op = 1;
  int64 account_id = 2;
  string request_id = 3;
  int32 lock_ttl_ms = 4;
}

message UserMsgQueueResponse {
  int64 value = 1;
}

message SelectRequest {
  // 从节点为这次客户端请求起的 ID。同一请求的多次选号（换号）共用：用户并发槽、利润否决次数、
  // 已排除的账号按请求记在主节点。
  string request_id = 1;
  // 这次请求里的第几次选号（从 1 开始），与 request_id 一起作幂等键。
  uint32 attempt = 2;
  // 客户端凭据原文：主节点自己验证，不信从节点的鉴权结论（设计 8.2）。
  oneof credential {
    string api_key = 3;
  }
  // 从节点按信任代理规则解析出的客户端 IP（IP 黑白名单、全局黑名单、cyber 会话范围用）。
  string client_ip = 4;
  string method = 5;
  // 入口路径（鉴权跳过计费、额度错误格式按它判断）。
  string path = 6;
  SelectEndpoint endpoint = 7;
  string model = 8;
  bool stream = 9;
  // 会话哈希（从节点按请求头和请求体算出）。
  string session_hash = 10;
  string previous_response_id = 11;
  // 显式生图意图（能力路由、分组是否允许生图）。
  bool image_intent = 12;
  // /responses/compact 旧路径；原生 v2 压缩。
  bool legacy_compact = 13;
  bool native_compaction_v2 = 14;
  // 本请求此前尝试失败、要排除的账号。
  repeated int64 excluded_account_ids = 15;
  // cyber 会话屏蔽要查的键（开关打开时由从节点算出，设计 3.4）。
  CyberSessionLookup cyber = 16;
  // 从节点手里这个用户各项子额度还没用掉的金额：主节点据此决定是否随选号补充。
  repeated HeldQuota held_quota = 17;
  // 请求里可能被下游解析到的全部模型名（分组模型白名单逐一检查，规则同 GroupModelAllowlist 中间件）。
  repeated string model_candidates = 18;
  // 客户端 User-Agent、从节点给这次请求的请求 ID（响应头 X-Request-Id）、客户端带的请求 ID：
  // 主节点在选号时记运维日志用（如 cyber 会话屏蔽的拒绝）。
  string user_agent = 19;
  string http_request_id = 20;
  string client_request_id = 21;
  // Codex 审查子代理的父会话哈希（service.WithOpenAIGuardianParentAffinity 从请求头和请求体算出）：
  // 选号优先用父会话绑定的账号。
  string guardian_parent_session_hash = 22;
  string guardian_parent_legacy_session_hash = 23;
  // WebSocket 连接选号：首帧的函数调用输出都能在上下文里找到对应调用（previous_response_id 可以换账号）。
  bool previous_response_can_move = 24;
  // 组合平台分组：选目标平台用的公开模型（改写请求体之前的，ResolveRoute 用的同一个）。主节点按它重新选定目标。
  string route_model = 25;
  // 自动分组 Key 这次请求用的分组（从节点按模型选定或切换后的；主节点核对是这把 Key 的候选再用）。
  int64 auto_group_id = 26;
  // 自动分组 Key 这次请求开始时的分组（中途换过组时与 auto_group_id 不同）。本地在请求开头按它做的检查
  // （previous_response_id 归属、分组是否允许生图、是否允许 /v1/messages 派发）换组后不再重做，主节点同样按它做。
  int64 auto_group_start_id = 27;
  // Anthropic Messages：请求体里的 metadata.user_id（选号时的会话数限制按它识别会话）。
  string metadata_user_id = 28;
  // Anthropic Messages：从节点按请求体算好的预热拦截类型（handler.InterceptType；0 不拦）。选到开了拦截的账号时
  // 主节点不准入，回 REJECTION_FORMAT_INTERCEPTED，从节点照本地写模拟响应。
  int32 intercept_type = 29;
  // Anthropic Messages：客户端请求里指纹要读的那几个头（service.FingerprintHeaderNames）。选到 OAuth / setup-token 账号时
  // 主节点按它们做与本地同一段 GetOrCreateFingerprint（指纹在主节点的缓存里）。
  map<string, string> fingerprint_headers = 30;
}

// cyber 会话屏蔽的查询键（都已哈希）。
message CyberSessionLookup {
  string explicit_key = 1;
  string scope_key = 2;
  repeated string transcript_keys = 3;
  // 请求体里的候选键超过上限被截断（范围已激活时按命中处理）。
  bool transcript_truncated = 4;
  // "最后一轮用户输入之前"的对话记录键：不用来查，cyber 命中后主节点写屏蔽表时用。
  string pre_latest_user_key = 5;
}

message HeldQuota {
  QuotaScope scope = 1;
  int64 unused = 2;
}

message SelectResponse {
  oneof result {
    Selection selection = 1;
    SelectRejection rejection = 2;
  }
}

// 拒绝的响应格式：从节点按它写客户端响应，与单机版一致。
enum RejectionFormat {
  REJECTION_FORMAT_UNSPECIFIED = 0;
  // 网关处理函数的错误：status / error_type / code / message，从节点按入口协议写出
  // （流式已开始时写流内错误）；cyber_block_key 非空时按 cyber 屏蔽的写法。
  REJECTION_FORMAT_GATEWAY = 1;
  // 处理函数之前的中间件（鉴权、黑名单、模型白名单、未分组拦截）写出的响应：
  // 主节点按本地同样的写法生成，从节点原样写出 status / headers / body。
  REJECTION_FORMAT_RAW = 2;
  // 换号用完：从节点按它最近一次上游错误写出（continuation_unsupported 时按"续链不支持"的 400）。
  REJECTION_FORMAT_FAILOVER_EXHAUSTED = 3;
  // 这个请求还不能经从节点处理（自动分组、组合平台分组、尚未接入的平台）：从节点交给主节点转发。
  REJECTION_FORMAT_UNSUPPORTED = 4;
  // 关闭 WebSocket 连接：status 是关闭码，message 是原因；cyber_block_key 非空时先按 cyber 屏蔽写错误帧。
  REJECTION_FORMAT_WS_CLOSE = 5;
  // Anthropic Messages：选到的账号开了预热拦截，这个请求要拦（intercept_type）；槽位已放，从节点写模拟响应。
  REJECTION_FORMAT_INTERCEPTED = 6;
  // Anthropic Messages：拿到槽位后利润终检否决（vetoed_account_id），槽位和会话注册已放。从节点照本地记一次否决
  // （FailoverState.RecordProfitVeto），没到上限就排除这个账号再选。
  REJECTION_FORMAT_PROFIT_VETOED = 7;
}

message SelectRejection {
  int32 status = 1;
  // 网关格式的错误类型（如 invalid_request_error）；鉴权格式为空。
  string error_type = 2;
  string code = 3;
  string message = 4;
  RejectionFormat format = 5;
  // 大于 0 时写 Retry-After。
  int32 retry_after_seconds = 6;
  // 运维标记，与单机版在同一位置打的一致。
  bool routing_capacity_limited = 7;
  string ops_business_limited_reason = 8;
  string ingress_reject_reason = 9;
  // 命中 cyber 会话屏蔽的键（从节点记运维日志用）。
  string cyber_block_key = 10;
  // REJECTION_FORMAT_RAW 的响应头和响应体。
  map<string, string> headers = 11;
  bytes body = 12;
  // REJECTION_FORMAT_FAILOVER_EXHAUSTED：这次选号里因为 previous_response_id 跳过了 OAuth 账号，
  // 最后的错误是"续链不支持"。
  bool continuation_unsupported = 13;
  // REJECTION_FORMAT_GATEWAY：按 Anthropic Messages 的错误格式写（OpenAI 分组的 /v1/messages 入口里
  // 单机按 Anthropic 格式写的那些错误）。
  bool anthropic_format = 14;
  // 自动分组 Key：这是本地会换到下一个候选分组再试的失败（选不出账号、换号用完）。从节点先问 SwitchAutoGroup，
  // 换成了就接着选号，没换成再按这个拒绝写。
  bool auto_group_failover = 15;
  // REJECTION_FORMAT_INTERCEPTED：拦截类型。
  int32 intercept_type = 16;
  // REJECTION_FORMAT_PROFIT_VETOED：被否决的账号。
  int64 vetoed_account_id = 17;
  // REJECTION_FORMAT_FAILOVER_EXHAUSTED：这是 Anthropic Messages 的选号耗尽（从节点照本地 HandleSelectionExhausted
  // 可能退避后接着选，请求记录留着）。
  bool anthropic_messages = 18;
}

message Selection {
  // 主节点起的选号 ID：释放、取凭据、补额度都按它。
  string selection_id = 1;
  int64 user_id = 2;
  int64 api_key_id = 3;
  // 本次使用的分组（0 表示未分组）与计费模式。
  int64 group_id = 4;
  BillingMode billing_mode = 5;
  AccountSnapshot account = 6;
  // 渠道映射后发给上游的模型；channel_mapped 为是否发生了映射。
  string forward_model = 7;
  bool channel_mapped = 8;
  string channel_mapped_model = 9;
  int64 channel_id = 10;
  string billing_model_source = 11;
  // 实际使用的会话哈希（池模式账号可能改写），后续选号和释放都用它。
  string session_hash = 12;
  // 扣费凭证：SignedToken（payload 是 Voucher）的编码。上报扣费时原样带回，主节点按这些字节验签。
  bytes voucher = 13;
  // 这次请求用到的各项子额度，和最低预估费用（从节点按它预扣）。
  repeated QuotaScope quota_scopes = 14;
  int64 quota_need = 15;
  // 随选号补充的额度。
  repeated QuotaGrant grants = 16;
  // 本请求的换号上限。
  int32 max_account_switches = 17;
  // 当前配置版本，从节点落后时先同步拉取。
  string config_version = 18;
  int64 pricing_at_unix_ms = 19;
  // 选中的是影子账号时，它的母账号（凭据取自母账号，转发时按 ID 找它）。
  AccountSnapshot credential_parent = 20;
  // WebSocket 连接选号：previous_response_id 命中了这个分组里的粘连账号（没命中时从节点剥掉首帧的
  // previous_response_id）。
  bool sticky_previous_hit = 21;
  // Anthropic Messages：这次请求开始时粘性会话绑定的账号（0 没有）。从节点据此判断"有绑定的会话"（换号时按本地规则
  // 强制按缓存计费）；成功转发后是否刷新绑定由主节点在释放时按同一条件决定。
  int64 sticky_bound_account_id = 22;
  // 分组所属渠道的功能配置（Channel.FeaturesConfig 的 JSON；分组没有渠道时为空）。转发路径上按分组查渠道的地方
  // （联网搜索模拟"跟随渠道"、Bedrock CC 兼容、Codex 生图桥接的渠道级开关）读它，渠道在主节点。
  bytes channel_features = 23;
  // Anthropic Messages，OAuth / setup-token 账号：主节点定下的指纹（service.Fingerprint 的 JSON）与开了会话 ID 伪装时
  // 现在的伪装会话 ID（可能为空，从节点照本地生成一个；真用到时以账号事件报回主节点写入、续期）。
  bytes fingerprint = 24;
  string masked_session_id = 25;
}

message FetchCredentialsRequest {
  string selection_id = 1;
}

message FetchCredentialsResponse {
  // 只含 id、credential_version、sealed_credentials。
  AccountSnapshot account = 1;
  // 影子账号的母账号（同样只含这三项）。
  AccountSnapshot credential_parent = 2;
}

message RefillQuotaRequest {
  string selection_id = 1;
  repeated HeldQuota held_quota = 2;
  // 这次要保证的最少金额（每一项"手里没用掉的 + 这次给的"都要不少于它）。
  int64 need = 3;
}

message RefillQuotaResponse {
  repeated QuotaGrant grants = 1;
}

// 选号用完（这次尝试结束），经事件连接发送、不等回复（设计 3.1）。按 selection_id 幂等。
// 上游错误决策的种类，对应 service.OpenAIUpstreamErrorDecider 的方法。
enum UpstreamErrorKind {
  UPSTREAM_ERROR_KIND_UNSPECIFIED = 0;
  // 一次上游错误响应（返回 should_disable）。
  UPSTREAM_ERROR_KIND_RESPONSE = 1;
  // OAuth 账号瞬时 429 能否同账号重试（返回 retry_same_account、retry_deadline_unix_ms）。
  UPSTREAM_ERROR_KIND_OAUTH429_RETRY = 2;
  // 流超时（返回 should_disable）。
  UPSTREAM_ERROR_KIND_STREAM_TIMEOUT = 3;
  // 错误策略（返回 error_policy）。
  UPSTREAM_ERROR_KIND_ERROR_POLICY = 4;
  // 只走限流服务自己的判定（返回 should_disable）。
  UPSTREAM_ERROR_KIND_RATE_LIMIT = 5;
}

message HeaderValues {
  string name = 1;
  repeated string values = 2;
}

message UpstreamErrorRequest {
  UpstreamErrorKind kind = 1;
  // 出错的账号，以及这次尝试的选号（知道时带上）。主节点用自己选号记录里的账号判定，
  // 不信消息里的账号内容。
  int64 account_id = 2;
  string selection_id = 3;
  int32 status_code = 4;
  // 上游响应头（去掉 Set-Cookie）和响应体（不超过 1 MiB）。
  repeated HeaderValues headers = 5;
  bytes body = 6;
  // 判定用的模型（账号映射后的调度模型、超时的模型、策略的模型）；has_model 为 false 表示没有。
  string model = 7;
  bool has_model = 8;
  // 请求范围的标记（判定会读）：自建的生图请求、从生图接口进来的请求。
  bool images_self_built = 9;
  bool images_endpoint = 10;
}

// 上游 cyber 策略命中（service.CyberPolicyMark 与请求上拍下的事实，handler.CyberPolicyHit）。
message CyberPolicyHitRequest {
  string selection_id = 1;
  int64 account_id = 2;
  // 上游标记：message、body（单机截到 4 KiB；超过 8 KiB 时主节点截断，落库前照单机脱敏）、上游状态码、上游已报的 token。
  string message = 3;
  string body = 4;
  int32 upstream_status = 5;
  int64 upstream_input_tokens = 6;
  int64 upstream_output_tokens = 7;
  // 请求上的事实（风控记录、运维日志用）：客户端请求的模型、流式、平台、路径、入口、UA、客户端 IP、请求 ID。
  string model = 8;
  bool stream = 9;
  string platform = 10;
  string request_path = 11;
  string inbound_endpoint = 12;
  string user_agent = 13;
  string client_ip = 14;
  string request_id = 15;
  string client_request_id = 16;
  int64 created_at_unix_ms = 17;
}

message CyberPolicyHitResponse {}

message ModerationViolationRequest {
  // 从节点这条审核记录（service.ContentModerationLog 的 JSON）。主节点只取计数、封号、通知要用的字段，
  // 输入内容摘录、命中的关键词、错误信息一律丢弃；用户、Key 按主节点自己的记录。
  bytes log = 1;
}

message ModerationViolationResponse {
  int32 violation_count = 1;
  bool auto_banned = 2;
  // 这一次刚封号（发封号通知用）。
  bool auto_ban_just_applied = 3;
}

message ModerationNotifyRequest {
  bytes log = 1;
  bool auto_ban_just_applied = 2;
  // cyber 策略命中的通知（否则按配置的"命中即通知"）。
  bool cyber = 3;
}

message ModerationNotifyResponse {
  bool email_sent = 1;
}

message FetchFlaggedHashesRequest {
  // 从 0 开始；回复的 next_cursor 为 0 表示拉完了。
  uint64 cursor = 1;
}

message FetchFlaggedHashesResponse {
  repeated string hashes = 1;
  uint64 next_cursor = 2;
}

message RecordFlaggedHashRequest {
  string hash = 1;
}

message RecordFlaggedHashResponse {}

message WebSearchUsageReport {
  // 搜索服务类型 -> 上次确认以来这台新用的次数。
  map<string, int64> used = 1;
}

message WebSearchUsageShares {
  repeated WebSearchShare shares = 1;
}

message WebSearchShare {
  string provider = 1;
  // 配额上限（0 表示不限）。
  int64 limit = 2;
  // 全局已用（含这次报上来的）。
  int64 used = 3;
  // 这台在下次上报之前最多还能用多少次（剩余按在线节点分摊，至少 1，用完为 0）。
  int64 allowance = 4;
}

message UpstreamErrorResponse {
  bool should_disable = 1;
  bool retry_same_account = 2;
  int64 retry_deadline_unix_ms = 3;
  // service.ErrorPolicyResult 的值。
  int32 error_policy = 4;
}

// ---- 扣费（设计第 5 节、开发计划 WP8）----

// 扣费记录的种类：决定主节点用哪个入账函数。
enum UsageRecordKind {
  USAGE_RECORD_KIND_UNSPECIFIED = 0;
  // OpenAI 网关（service.OpenAIGatewayService.RecordUsage）。
  USAGE_RECORD_KIND_OPENAI = 1;
  // OpenAI 网关上 cyber 策略拒绝、转发返回错误的请求（service.OpenAIGatewayService.RecordCyberPolicyUsageLog 的口径：
  // 只有上游已报的 token，按入账时计价）。
  USAGE_RECORD_KIND_OPENAI_CYBER_POLICY = 2;
  // Anthropic 网关（service.GatewayService.RecordUsage，GatewayHandler.Messages）：result_json 是 service.ForwardResult。
  USAGE_RECORD_KIND_ANTHROPIC = 3;
}

// 一条扣费记录（设计 5.1）：扣费凭证 + 只有转发的从节点知道的事实（字段清单见 relayselect 的字段守卫）。
// 价格、倍率、选号定下的值都不在这里：主节点按凭证和自己的配置重新计算。
message UsageRecord {
  // 从节点给这条记录的序号（本节点内递增），确认按它对应。
  uint64 seq = 1;
  // 扣费凭证（选号时拿到的 SignedToken 编码，原样）。
  bytes voucher = 2;
  UsageRecordKind kind = 3;
  // 转发结果（OpenAI：service.OpenAIForwardResult 的 JSON）。
  bytes result_json = 4;
  string inbound_endpoint = 5;
  string upstream_endpoint = 6;
  string user_agent = 7;
  string ip_address = 8;
  string session_id = 9;
  string request_payload_hash = 10;
  bool cyber_blocked = 11;
  bool native_compaction_v2 = 12;
  // 请求 ID（入账日志、扣费请求 ID 的回退）。
  string client_request_id = 13;
  string request_id = 14;
  // Anthropic：换号时按本地规则强制按缓存计费（FailoverState.ForceCacheBilling：有绑定的会话实际换了账号，或上游
  // 明确要求）。与 token 数一样是转发节点得出的事实。
  bool force_cache_billing = 15;
}

// 一批扣费记录。batch_seq 是本节点的批次序号（连续递增），主节点据此发现漏掉或重复的批次（只报警，
// 入账本身按凭证去重）。
message UsageBatch {
  uint64 batch_seq = 1;
  repeated UsageRecord records = 2;
}

message UsageBatchAck {
  repeated UsageRecordResult results = 1;
}

enum UsageRecordStatus {
  USAGE_RECORD_STATUS_UNSPECIFIED = 0;
  // 这次入账了。
  USAGE_RECORD_STATUS_SETTLED = 1;
  // 之前已经入账过（重发）：consumed 是当时的消耗。
  USAGE_RECORD_STATUS_ALREADY_SETTLED = 2;
  // 记录有问题（凭证验不过、格式错误等）：主节点隔离并报警，从节点不要重发。
  USAGE_RECORD_STATUS_REJECTED = 3;
  // 主节点暂时处理不了（数据库故障等）：从节点稍后重发。
  USAGE_RECORD_STATUS_RETRY = 4;
}

// 一条记录的入账结果：按租约消耗了多少（从节点据此修正本地额度）。
message UsageRecordResult {
  uint64 seq = 1;
  UsageRecordStatus status = 2;
  repeated LeaseConsumption consumed = 3;
  string reason = 4;
}

message LeaseConsumption {
  int64 lease_id = 1;
  QuotaScope scope = 2;
  // 微单位（1 = 10⁻⁸）。
  int64 amount = 3;
}

// 账号事件（设计 7.3）：转发结果对账号状态的影响（调度统计、健康熔断、Codex 用量快照、传输错误的
// 临时不可调度等），经事件连接发送、不等回复；主节点用单机同一段代码执行（service.OpenAIAccountReporter）。
// 只认这台节点正在用或刚用过的账号，用主节点记录里的账号对象。
message AccountEvent {
  int64 account_id = 1;
  oneof kind {
    ScheduleResultEvent schedule_result = 10;
    HealthFailureEvent health_failure = 11;
    AccountSwitchEvent account_switch = 12;
    CodexUsageEvent codex_usage = 13;
    TransportErrorEvent transport_error = 14;
    OllamaActivityEvent ollama_activity = 15;
    SessionWindowEvent session_window = 16;
    TempUnschedulableEvent temp_unschedulable = 17;
    MaskedSessionEvent masked_session = 18;
  }
}

// 健康熔断要看的失败事实（service.OpenAIHealthFailureFacts）；eligible 为 false 表示不计入熔断。
message HealthFailureFacts {
  bool eligible = 1;
  int32 status_code = 2;
  // 上游响应体摘要（不超过 8 KiB，写进临时不可调度的原因里）。
  bytes body = 3;
}

message ScheduleResultEvent {
  string model = 1;
  bool success = 2;
  bool has_first_token_ms = 3;
  int32 first_token_ms = 4;
  int64 serving_group_id = 5;
  string reasoning_effort = 6;
  HealthFailureFacts failure = 7;
}

message HealthFailureEvent {
  HealthFailureFacts failure = 1;
}

message AccountSwitchEvent {}

message CodexUsageEvent {
  // service.OpenAICodexUsageSnapshot 的 JSON（updated_at 为从节点收到响应的时间）。
  bytes snapshot_json = 1;
}

// 非 OpenAI 网关转发路径上的临时不可调度（GatewayService 里直接写 accountRepo.SetTempUnschedulable 的几处：
// 请求级 400/502 同账号重试用尽、持久的传输错误）。主节点照写，时长不超过这些地方用的最长时长。
message TempUnschedulableEvent {
  int64 until_unix_ms = 1;
  string reason = 2;
}

// 从节点转发时用了伪装会话 ID（本地 RewriteUserIDWithMasking 里写入并续期 15 分钟）：主节点照写。
message MaskedSessionEvent {
  string session_id = 1;
}

message TransportErrorEvent {
  // 已脱敏的传输错误。
  string message = 1;
}

message OllamaActivityEvent {}

// Anthropic 原生直通的响应头里的会话窗口（只带 anthropic-ratelimit-unified-* 这几个头）。
message SessionWindowEvent {
  repeated HeaderValues headers = 1;
}

message SelectionRelease {
  string selection_id = 1;
  // 这是这次客户端请求的最后一次尝试：主节点同时放掉按请求占的用户并发槽。
  bool request_done = 2;
  // 上游返回的 response id（Responses），主节点记下账号和归属，后续 previous_response_id 用。
  repeated string response_ids = 3;
  // 这次选号的扣费凭证（原样）。选号在主节点上已被清理时（长请求超过占用上限），
  // 主节点验签后按凭证里的账号、分组、用户、Key 记响应归属，不信消息里的其他值。
  bytes voucher = 4;
  // WebSocket 一轮结束：放掉这一轮的用户槽和账号槽、记响应归属，选号留着（账号绑定这条连接）。
  bool turn_end = 5;
  // turn_end 时是哪一轮（BeginTurn 回的 turn_id）。事件连接上的释放可能晚于下一轮的 BeginTurn：
  // 主节点只放这一轮还开着时占的槽，已被下一轮接手的不动。
  string turn_id = 6;
  // Anthropic Messages：这次尝试转发成功（本地这时刷新粘性会话绑定）。主节点按本地同一条件决定刷不刷：请求开始时
  // 没有绑定，或者绑定的就是这个账号。
  bool forward_succeeded = 7;
  // 请求结束、手里没有进行中的选号时（最后一次选号被拒、之后没再选）：selection_id 为空，按 request_id 结束这次
  // 请求（放掉用户槽）。request_done 同时为 true。
  string request_id = 8;
  // Anthropic Messages：上游已服务这次尝试（转发成功，或出错前上游已计量、用量已入队）。没服务时主节点立即放掉
  // 这个账号为这次会话做的会话数注册（本地 failover 继续时、请求最终失败时的释放）。
  bool upstream_served = 9;
}

message BeginTurnRequest {
  string selection_id = 1;
  // 连接内的第几轮（每次选号从 1 开始，与单机的钩子一致）。
  int32 turn = 2;
  // 这一轮客户端请求的模型（凭证里的请求模型和渠道映射按它）。
  string model = 3;
  // 从节点手里这个用户各项子额度还没用掉的金额（同 SelectRequest.held_quota）。
  repeated HeldQuota held_quota = 4;
}

message BeginTurnResponse {
  // 非 0 时关闭连接：WebSocket 关闭码与原因（单机在同样情况下用的）。
  int32 close_status = 1;
  string close_reason = 2;
  // 这一轮的扣费凭证（用量上报时原样带回）。
  bytes voucher = 3;
  repeated QuotaScope quota_scopes = 4;
  int64 quota_need = 5;
  repeated QuotaGrant grants = 6;
  int64 pricing_at_unix_ms = 7;
  // 这一轮的 ID：结束这一轮的释放消息带回。
  string turn_id = 8;
  // 9 曾是安全审计策略。
  reserved 9;
}

message TurnMappingRequest {
  string selection_id = 1;
  string model = 2;
}

message TurnMappingResponse {
  bool channel_mapped = 1;
  string channel_mapped_model = 2;
  int64 channel_id = 3;
  string billing_model_source = 4;
}

enum WebSocketLeaseOp {
  WEB_SOCKET_LEASE_OP_UNSPECIFIED = 0;
  WEB_SOCKET_LEASE_OP_ACQUIRE = 1;
  WEB_SOCKET_LEASE_OP_REFRESH = 2;
  WEB_SOCKET_LEASE_OP_RELEASE = 3;
}

message WebSocketLeaseRequest {
  WebSocketLeaseOp op = 1;
  // 申请时带 Key 原文（主节点自己验证）；续期、释放按 lease_id。
  string api_key = 2;
  string lease_id = 3;
}

message WebSocketLeaseResponse {
  // 申请：拿到了（没拿到表示这个 Key 的连接数到了上限）；续期：租约还在。
  bool ok = 1;
}


// 账号快照：选号结果里给从节点转发用的账号（设计 2.2、9）。按白名单编码
// （internal/relay/accountcodec）：转发要用的普通配置原样带上；密钥（上游 Key、短期 access token、
// 代理密码、自定义请求头等白名单外的一切）放进 sealed_credentials，用这台节点的 X25519 加密公钥
// 加密（设计 7.1），附加数据绑定节点、账号和凭据版本。refresh token、client secret、服务账号文件
// 永远不离开主节点。
message AccountSnapshot {
  int64 id = 1;
  string name = 2;
  string platform = 3;
  string type = 4;
  int32 concurrency = 5;
  int32 priority = 6;
  // 未声明时 has_rate_multiplier 为 false（按 1.0 处理）。
  bool has_rate_multiplier = 7;
  double rate_multiplier = 8;
  bool rate_multiplier_undeclared = 9;
  string status = 10;
  // 白名单内的凭据字段（JSON 对象）。
  bytes public_credentials = 11;
  // Extra（JSON 对象），名字像密钥的字段已剔除。
  bytes extra = 12;
  int64 parent_account_id = 13;
  string quota_dimension = 14;
  repeated int64 group_ids = 15;
  ProxySnapshot proxy = 16;
  // 贡献房间路由的结果（只对这一次请求有效）。
  string contribution_route_source = 17;
  int64 contribution_room_id = 18;
  bool has_contribution_rate_multiplier_override = 19;
  double contribution_rate_multiplier_override = 20;
  // 凭据版本：密钥内容的哈希。节点已有同一版本时 sealed_credentials 为空，用本地缓存的（设计 9.1）。
  string credential_version = 21;
  bytes sealed_credentials = 22;
}

// 代理快照；用户名、密码在 sealed_credentials 里（键 __proxy_username / __proxy_password）。
message ProxySnapshot {
  int64 id = 1;
  string name = 2;
  string protocol = 3;
  string host = 4;
  int32 port = 5;
  string status = 6;
  bool has_owner_user_id = 7;
  int64 owner_user_id = 8;
}

