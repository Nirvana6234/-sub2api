// 主从节点通信协议（docs/MASTER_RELAY_NODES.md 第 7 节，开发计划 2.3）。
//
// 连接按优先级分开（控制 / 事件 / 扣费 / 审核 / 日志），每类连接只调用对应的
// service。业务消息由后续工作包逐步加入：
//   - 新增 RPC 只加不改；
//   - 事件流的信封用 oneof，字段号按下面的保留区间分配，老版本收到不认识的类型
//     会忽略，不会出错。
//
// 生成：internal/relay/proto/generate.sh（不要手改生成代码）。
syntax = "proto3";

package sub2api.relay.v1;

option go_package = "github.com/Wei-Shaw/sub2api/internal/relay/proto/relayv1;relayv1";

// 接入：握手、注册、证书续签与恢复（WP3）。允许未签发证书的对端调用，
// 各 RPC 允许的对端类型见 internal/relay/transport 的访问策略。
service RelayEnrollment {
  // Hello 返回主节点纪元、协议版本范围，以及主节点眼中这个对端的类型。
  rpc Hello(HelloRequest) returns (HelloResponse);
  // Register 登记一台新节点（设计 11.1）。必须用长期密钥自签的证书握手：节点身份
  // 就是这把密钥的指纹，由 TLS 证明持有，不信消息里报的值。重复注册是幂等的。
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // NodeStatus 查询这把长期密钥对应节点的状态，同时是待激活期间的心跳（设计 11.2）。
  rpc NodeStatus(NodeStatusRequest) returns (NodeStatusResponse);
  // ObtainCertificate 已激活节点用长期密钥领取主从通信证书：激活后第一次、
  // 重启后手里没有有效证书、证书过期后的恢复（设计 7.2 第 4 条）。
  rpc ObtainCertificate(CertificateRequest) returns (CertificateResponse);
  // RenewCertificate 用当前签发证书续签，同时换新的 TLS 密钥和加密密钥（设计 7.2 第 1 条）。
  rpc RenewCertificate(CertificateRequest) returns (CertificateResponse);
}

// 控制连接：选号、上游错误决策、额度、Key 查询等同步小消息（WP6、WP7、WP11）。
service RelayControl {
  rpc Ping(PingRequest) returns (PingResponse);
  // FetchConfig 拉取本节点的配置快照（启动、重连、纪元变化、版本落后时，设计 6.2）。
  rpc FetchConfig(FetchConfigRequest) returns (ConfigSnapshot);

  // ---- 额度（设计第 4 节）。申请随选号一起（WP7），这里是退回、续期、核对、收回确认。----
  // 这几个调用都动钱：必须带当前纪元，跨纪元一律拒绝（EPOCH_MISMATCH）；从节点先上报租约
  // （ReportLeases），再用同样的数值重发，不清零。
  // 退回类消息带"这份租约至今累计退回"而不是增量；主节点把累计记在租约上（持久化），只处理多出来的
  // 部分，重发、回复丢失、主节点重启后再发都只生效一次。
  rpc ReleaseQuota(ReleaseQuotaRequest) returns (ReleaseQuotaResponse);
  rpc RenewLeases(RenewLeasesRequest) returns (RenewLeasesResponse);
  // ReportLeases 重连或纪元变化后上报手里的租约：主节点关掉没上报的，告诉节点哪些已作废。
  // 上报完成之前从节点不发选号。
  rpc ReportLeases(ReportLeasesRequest) returns (ReportLeasesResponse);
  rpc AckQuotaRecall(AckQuotaRecallRequest) returns (AckQuotaRecallResponse);
}

// 事件连接：一条长期双向流，承载心跳、释放、账号事件，以及主节点下发的指令。
service RelayEvents {
  rpc Stream(stream NodeEnvelope) returns (stream MasterEnvelope);
}

// 对端类型，与 transport.PeerClass 一一对应。
enum PeerClass {
  PEER_CLASS_UNSPECIFIED = 0;
  // 没有出示证书（只能注册）。
  PEER_CLASS_ANONYMOUS = 1;
  // 用从节点长期密钥自签的证书（待激活、证书过期后的恢复）。
  PEER_CLASS_LONG_TERM = 2;
  // 主节点签发的主从通信证书（已激活节点的正常通信）。
  PEER_CLASS_ISSUED = 3;
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message HelloRequest {
  ProtocolVersion version = 1;
  string program_version = 2;
}

message HelloResponse {
  string master_epoch = 1;
  ProtocolVersion min_supported = 2;
  ProtocolVersion current = 3;
  PeerClass peer_class = 4;
  // 签发证书的对端：证书里的节点 ID。其他类型为 0。
  int64 node_id = 5;
  // 主节点当前时间（Unix 毫秒），用于测时钟偏差（设计 7.4）。
  int64 master_time_unix_ms = 6;
}

// 节点状态，与 relay_nodes.status 对应。
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  // 这把长期密钥没有注册过（或已被清除）。
  NODE_STATUS_UNKNOWN = 1;
  NODE_STATUS_PENDING = 2;
  NODE_STATUS_ACTIVE = 3;
  NODE_STATUS_DRAINING = 4;
  NODE_STATUS_DISABLED = 5;
  NODE_STATUS_REJECTED = 6;
}

message RegisterRequest {
  string hostname = 1;
  string program_version = 2;
  map<string, string> system_info = 3;
  string display_name = 4;
}

message RegisterResponse {
  NodeStatus status = 1;
  // 主节点算出的长期密钥指纹，从节点把它和本机打印的对一下。
  string key_fingerprint = 2;
  // 全部未停用的主从通信根证书指纹（含预备中的），从节点用它替换本机存下的列表（设计 7.4）。
  repeated string root_fingerprints = 3;
}

message NodeStatusRequest {
  string program_version = 1;
}

message NodeStatusResponse {
  NodeStatus status = 1;
  int64 heartbeat_interval_ms = 2;
  string key_fingerprint = 3;
  // 同 RegisterResponse.root_fingerprints：待激活、已停用的节点靠心跳拿到预备中的新根。
  repeated string root_fingerprints = 4;
}

message CertificateRequest {
  // 新的 TLS 公钥（PKIX DER，Ed25519）。私钥只在从节点本机。
  bytes tls_public_key = 1;
  // 新的加密公钥（X25519，32 字节），用于上游凭据的二次加密（设计 7.1 第 4 条）。
  bytes encryption_public_key = 2;
}

message CertificateResponse {
  // 签发的证书（DER）。
  bytes certificate = 1;
  int64 not_after_unix_ms = 2;
  int64 node_id = 3;
  // 同 RegisterResponse.root_fingerprints。
  repeated string root_fingerprints = 4;
}

message PingRequest {
  bytes payload = 1;
}

message PingResponse {
  bytes payload = 1;
  int64 master_time_unix_ms = 2;
}

// 从节点 → 主节点的事件信封。
// 字段号：1~9 信封本身；10~99 从节点上报的事件；100~199 对主节点指令的回执；
// 200 起留给以后。
message NodeEnvelope {
  uint64 seq = 1;
  oneof body {
    EventPing ping = 10;
  }
}

message FetchConfigRequest {
  // 从节点手里的版本；与当前一致时只回 unchanged。
  string known_version = 1;
}

// 配置快照（设计 6 第二类、11.3）。版本是内容哈希：内容相同版本就相同，
// 主节点重启后也一致；从节点只比较是否相等。
message ConfigSnapshot {
  string version = 1;
  bool unchanged = 2;
  // 按白名单下发的系统设置。白名单外的设置在从节点上读到空值；不含任何密钥。
  map<string, string> settings = 3;
  // 其他配置分段（错误透传规则、TLS 指纹等，内容为 JSON），由主节点按需登记。
  map<string, bytes> sections = 4;
  // 本节点配置与主从分流通用配置（JSON）。
  bytes node_config = 5;
  // 主从通信根证书指纹（含轮换中的新根），从节点据此更新固定的指纹。
  repeated string root_fingerprints = 6;
  // 验中转票据的公钥（全部未停用的版本，含预备中的，设计 8.1）。
  // 扣费凭证只在主节点验，公钥不下发。
  repeated SigningPublicKey ticket_public_keys = 7;
}

// 配置变了，从节点拉取新版本。
message ConfigChanged {
  string version = 1;
}

// 缓存作废（设计 6 第三类）。收到后从节点清掉对应缓存，下一个请求重新向主节点查询。
message Invalidation {
  // API Key 鉴权缓存键：原始 Key 的 SHA-256（十六进制）。新建 Key 也会发，
  // 用来清掉"查不到"的负缓存。
  repeated string api_key_hashes = 1;
  repeated int64 user_ids = 2;
  repeated int64 group_ids = 3;
}

// 主节点 → 从节点的事件信封。
// 字段号：1~9 信封本身；10~99 主节点指令；100~199 对从节点事件的回执；200 起留给以后。
message MasterEnvelope {
  uint64 seq = 1;
  oneof body {
    EventPing ping = 10;
    ConfigChanged config_changed = 11;
    Invalidation invalidation = 12;
    TicketRevocations ticket_revocations = 13;
    QuotaRecall quota_recall = 14;
  }
}

message EventPing {
  bytes payload = 1;
}

// ---- 签名（开发计划 WP5，internal/relay/sign）----

// 签名信封：payload 是 Ticket 或 Voucher 的 protobuf 编码，按收到的原始字节验签。
// 签名 = Ed25519(私钥, 用途串 || 0x00 || payload)，用途串区分票据和凭证，一种不能冒充另一种。
message SignedToken {
  // 签名密钥版本（keystore 的版本号）。
  uint32 key_version = 1;
  bytes payload = 2;
  bytes signature = 3;
}

message SigningPublicKey {
  uint32 version = 1;
  // Ed25519 公钥，32 字节。
  bytes public_key = 2;
}

// 中转票据（设计 8.1）：小白端访问分配的从节点用，10 分钟有效。
message Ticket {
  int64 user_id = 1;
  // 只能在这台从节点上用。
  int64 node_id = 2;
  // 签发时用户的 token_version（由邮箱和密码哈希推导）。主节点选号时和当前值比对，
  // 改密码、改邮箱后旧票据在下一个请求被拒，和登录态一致。
  int64 token_version = 3;
  int64 issued_at_unix_ms = 4;
  int64 expires_at_unix_ms = 5;
}

// 计费模式（设计 5.3）。
enum BillingMode {
  BILLING_MODE_UNSPECIFIED = 0;
  BILLING_MODE_BALANCE = 1;
  BILLING_MODE_SUBSCRIPTION = 2;
}

// 扣费凭证（设计 5.3）：主节点每次选号签发一张，从节点上报扣费记录时原样带回，主节点验签后才入账。
message Voucher {
  // UUID（16 字节）；与 issued_at 一起是 relay_voucher_consumed 的主键，每张只入账一次。
  bytes voucher_id = 1;
  int64 issued_at_unix_ms = 2;
  // 只能由这台从节点上报（入账时核对，WP8）。
  int64 node_id = 3;
  string selection_id = 4;
  int64 user_id = 5;
  int64 api_key_id = 6;
  int64 account_id = 7;
  int64 group_id = 8;
  BillingMode billing_mode = 9;
  string requested_model = 10;
  // 上报的实际模型必须在这里面，否则按请求模型计费并报警（设计 5.3）。
  repeated string allowed_billing_models = 11;
  Quote quote = 12;
  SelectionContext context = 13;
}

// 报价：签发时的计价输入，入账按它计价（设计 5.3、6 第一类）。
// 字段由 WP7 / WP8 按开发计划 2.2 的脚本补齐。金额用整数微单位（1 = 10⁻⁸），
// 单价按每百万 token 表示（按每 token 会出现小数，比如 0.075 美元每百万 token）。
message Quote {
}

// 选号上下文：扣费函数从请求上下文读、由选号决定的值，入账前原样恢复（设计 5.3）。
// 其余字段由 WP7 / WP8 按开发计划 2.2 的脚本补齐。
message SelectionContext {
  // 计价时间（openai_profit_control 的 pricingAt）。
  int64 pricing_at_unix_ms = 1;
}

// 票据吊销（设计 8.1）：这些用户在 revoked_before 及之前签发的票据作废。
// 从节点只拿它提前拒绝；以主节点选号时的复查为准。
message TicketRevocations {
  repeated RevokedTicketUser users = 1;
}

message RevokedTicketUser {
  int64 user_id = 1;
  int64 revoked_before_unix_ms = 2;
}

// ---- 额度（设计第 4 节，开发计划 WP6）。金额都是整数微单位（1 = 10⁻⁸）。----

message QuotaScope {
  string dimension = 1;
  // 订阅窗口为分组 ID，Key 维度为 API Key ID，其余为 0。
  int64 scope_id = 2;
  // 平台配额为平台名，其余为空。
  string scope_key = 3;
}

// 主节点给出的一项额度（随选号回复下发，WP7）。
message QuotaGrant {
  int64 lease_id = 1;
  int64 user_id = 2;
  QuotaScope scope = 3;
  // 这次新给的。
  int64 amount = 4;
  // 这份租约现在总共锁着的（含节点已用、未入账的）。
  int64 granted = 5;
  int64 expires_at_unix_ms = 6;
}

// 一份租约的退回：这份租约至今累计退回了多少（不是增量，跨纪元也不清零）。
// closed 表示节点放弃整份租约（剩下的全部退回）。
message LeaseReturn {
  int64 lease_id = 1;
  int64 user_id = 2;
  int64 returned_total = 3;
  bool closed = 4;
}

message ReleaseQuotaRequest {
  repeated LeaseReturn returns = 1;
}

message ReleaseQuotaResponse {
  // 主节点已不认的租约（已关闭、已作废）：节点立即丢弃，不再使用。
  repeated int64 dropped_lease_ids = 1;
}

message LeaseRenewal {
  int64 lease_id = 1;
  int64 user_id = 2;
  // 最后一次用这份额度的时间（闲置判断，设计 4.4）；没用过为 0。
  int64 last_used_at_unix_ms = 3;
}

message RenewLeasesRequest {
  repeated LeaseRenewal leases = 1;
}

message RenewedLease {
  int64 lease_id = 1;
  int64 expires_at_unix_ms = 2;
}

message RenewLeasesResponse {
  repeated RenewedLease renewed = 1;
  repeated int64 dropped_lease_ids = 2;
}

message HeldLease {
  int64 lease_id = 1;
  int64 user_id = 2;
}

message ReportLeasesRequest {
  repeated HeldLease leases = 1;
}

message ReportLeasesResponse {
  repeated int64 dropped_lease_ids = 1;
}

// 主节点要求收回某个用户的一项子额度（设计 4.2、4.4）。idle_only 时只收回闲置的。
message QuotaRecall {
  string recall_id = 1;
  int64 user_id = 2;
  QuotaScope scope = 3;
  bool idle_only = 4;
}

message AckQuotaRecallRequest {
  string recall_id = 1;
  repeated LeaseReturn returns = 2;
}

message AckQuotaRecallResponse {
  repeated int64 dropped_lease_ids = 1;
}

