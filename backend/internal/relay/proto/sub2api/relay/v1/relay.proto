// 主从节点通信协议（docs/MASTER_RELAY_NODES.md 第 7 节，开发计划 2.3）。
//
// 连接按优先级分开（控制 / 事件 / 扣费 / 审核 / 日志），每类连接只调用对应的
// service。业务消息由后续工作包逐步加入：
//   - 新增 RPC 只加不改；
//   - 事件流的信封用 oneof，字段号按下面的保留区间分配，老版本收到不认识的类型
//     会忽略，不会出错。
//
// 生成：internal/relay/proto/generate.sh（不要手改生成代码）。
syntax = "proto3";

package sub2api.relay.v1;

option go_package = "github.com/Wei-Shaw/sub2api/internal/relay/proto/relayv1;relayv1";

// 接入：握手、注册、证书续签与恢复（WP3）。允许未签发证书的对端调用，
// 各 RPC 允许的对端类型见 internal/relay/transport 的访问策略。
service RelayEnrollment {
  // Hello 返回主节点纪元、协议版本范围，以及主节点眼中这个对端的类型。
  rpc Hello(HelloRequest) returns (HelloResponse);
  // Register 登记一台新节点（设计 11.1）。必须用长期密钥自签的证书握手：节点身份
  // 就是这把密钥的指纹，由 TLS 证明持有，不信消息里报的值。重复注册是幂等的。
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // NodeStatus 查询这把长期密钥对应节点的状态，同时是待激活期间的心跳（设计 11.2）。
  rpc NodeStatus(NodeStatusRequest) returns (NodeStatusResponse);
  // ObtainCertificate 已激活节点用长期密钥领取主从通信证书：激活后第一次、
  // 重启后手里没有有效证书、证书过期后的恢复（设计 7.2 第 4 条）。
  rpc ObtainCertificate(CertificateRequest) returns (CertificateResponse);
  // RenewCertificate 用当前签发证书续签，同时换新的 TLS 密钥和加密密钥（设计 7.2 第 1 条）。
  rpc RenewCertificate(CertificateRequest) returns (CertificateResponse);
}

// 控制连接：选号、上游错误决策、额度、Key 查询等同步小消息（WP6、WP7、WP11）。
service RelayControl {
  rpc Ping(PingRequest) returns (PingResponse);
  // FetchConfig 拉取本节点的配置快照（启动、重连、纪元变化、版本落后时，设计 6.2）。
  rpc FetchConfig(FetchConfigRequest) returns (ConfigSnapshot);

  // ---- 额度（设计第 4 节）。申请随选号一起（WP7），这里是退回、续期、核对、收回确认。----
  // 这几个调用都动钱：必须带当前纪元，跨纪元一律拒绝（EPOCH_MISMATCH）；从节点先上报租约
  // （ReportLeases），再用同样的数值重发，不清零。
  // 退回类消息带"这份租约至今累计退回"而不是增量；主节点把累计记在租约上（持久化），只处理多出来的
  // 部分，重发、回复丢失、主节点重启后再发都只生效一次。
  rpc ReleaseQuota(ReleaseQuotaRequest) returns (ReleaseQuotaResponse);
  rpc RenewLeases(RenewLeasesRequest) returns (RenewLeasesResponse);
  // ReportLeases 重连或纪元变化后上报手里的租约：主节点关掉没上报的，告诉节点哪些已作废。
  // 上报完成之前从节点不发选号。
  rpc ReportLeases(ReportLeasesRequest) returns (ReportLeasesResponse);
  rpc AckQuotaRecall(AckQuotaRecallRequest) returns (AckQuotaRecallResponse);

  // ---- 选号（设计 3.1 第 5 步、开发计划 WP7）----
  // Select 为一次客户端请求的一次尝试选号：主节点复查凭据、做只有它能做的检查、选号、占并发槽，
  // 签发扣费凭证，需要时顺带补充额度。带幂等键（请求 ID + 第几次选号）：超时重发拿到同一个结果。
  // 被拒绝时正常返回 rejection（不是 gRPC 错误），从节点按它写客户端响应。
  rpc Select(SelectRequest) returns (SelectResponse);
  // FetchCredentials 取一次进行中的选号所选账号的上游凭据：从节点缓存里没有这个版本时用（设计 9.1）。
  // 只有这次选号还没释放、且账号就是它选中的，主节点才给。
  rpc FetchCredentials(FetchCredentialsRequest) returns (FetchCredentialsResponse);
  // RefillQuota 按一次进行中的选号补充额度（提前补充，设计 4.2）：主节点按这次选号的用户、Key、
  // 分组、订阅重新算剩余；选号已释放时拒绝。
  rpc RefillQuota(RefillQuotaRequest) returns (RefillQuotaResponse);
}

// 事件连接：一条长期双向流，承载心跳、释放、账号事件，以及主节点下发的指令。
service RelayEvents {
  rpc Stream(stream NodeEnvelope) returns (stream MasterEnvelope);
}

// 对端类型，与 transport.PeerClass 一一对应。
enum PeerClass {
  PEER_CLASS_UNSPECIFIED = 0;
  // 没有出示证书（只能注册）。
  PEER_CLASS_ANONYMOUS = 1;
  // 用从节点长期密钥自签的证书（待激活、证书过期后的恢复）。
  PEER_CLASS_LONG_TERM = 2;
  // 主节点签发的主从通信证书（已激活节点的正常通信）。
  PEER_CLASS_ISSUED = 3;
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message HelloRequest {
  ProtocolVersion version = 1;
  string program_version = 2;
}

message HelloResponse {
  string master_epoch = 1;
  ProtocolVersion min_supported = 2;
  ProtocolVersion current = 3;
  PeerClass peer_class = 4;
  // 签发证书的对端：证书里的节点 ID。其他类型为 0。
  int64 node_id = 5;
  // 主节点当前时间（Unix 毫秒），用于测时钟偏差（设计 7.4）。
  int64 master_time_unix_ms = 6;
}

// 节点状态，与 relay_nodes.status 对应。
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  // 这把长期密钥没有注册过（或已被清除）。
  NODE_STATUS_UNKNOWN = 1;
  NODE_STATUS_PENDING = 2;
  NODE_STATUS_ACTIVE = 3;
  NODE_STATUS_DRAINING = 4;
  NODE_STATUS_DISABLED = 5;
  NODE_STATUS_REJECTED = 6;
}

message RegisterRequest {
  string hostname = 1;
  string program_version = 2;
  map<string, string> system_info = 3;
  string display_name = 4;
}

message RegisterResponse {
  NodeStatus status = 1;
  // 主节点算出的长期密钥指纹，从节点把它和本机打印的对一下。
  string key_fingerprint = 2;
  // 全部未停用的主从通信根证书指纹（含预备中的），从节点用它替换本机存下的列表（设计 7.4）。
  repeated string root_fingerprints = 3;
}

message NodeStatusRequest {
  string program_version = 1;
}

message NodeStatusResponse {
  NodeStatus status = 1;
  int64 heartbeat_interval_ms = 2;
  string key_fingerprint = 3;
  // 同 RegisterResponse.root_fingerprints：待激活、已停用的节点靠心跳拿到预备中的新根。
  repeated string root_fingerprints = 4;
}

message CertificateRequest {
  // 新的 TLS 公钥（PKIX DER，Ed25519）。私钥只在从节点本机。
  bytes tls_public_key = 1;
  // 新的加密公钥（X25519，32 字节），用于上游凭据的二次加密（设计 7.1 第 4 条）。
  bytes encryption_public_key = 2;
}

message CertificateResponse {
  // 签发的证书（DER）。
  bytes certificate = 1;
  int64 not_after_unix_ms = 2;
  int64 node_id = 3;
  // 同 RegisterResponse.root_fingerprints。
  repeated string root_fingerprints = 4;
}

message PingRequest {
  bytes payload = 1;
}

message PingResponse {
  bytes payload = 1;
  int64 master_time_unix_ms = 2;
}

// 从节点 → 主节点的事件信封。
// 字段号：1~9 信封本身；10~99 从节点上报的事件；100~199 对主节点指令的回执；
// 200 起留给以后。
message NodeEnvelope {
  uint64 seq = 1;
  oneof body {
    EventPing ping = 10;
    SelectionRelease selection_release = 11;
  }
}

message FetchConfigRequest {
  // 从节点手里的版本；与当前一致时只回 unchanged。
  string known_version = 1;
}

// 配置快照（设计 6 第二类、11.3）。版本是内容哈希：内容相同版本就相同，
// 主节点重启后也一致；从节点只比较是否相等。
message ConfigSnapshot {
  string version = 1;
  bool unchanged = 2;
  // 按白名单下发的系统设置。白名单外的设置在从节点上读到空值；不含任何密钥。
  map<string, string> settings = 3;
  // 其他配置分段（错误透传规则、TLS 指纹等，内容为 JSON），由主节点按需登记。
  map<string, bytes> sections = 4;
  // 本节点配置与主从分流通用配置（JSON）。
  bytes node_config = 5;
  // 主从通信根证书指纹（含轮换中的新根），从节点据此更新固定的指纹。
  repeated string root_fingerprints = 6;
  // 验中转票据的公钥（全部未停用的版本，含预备中的，设计 8.1）。
  // 扣费凭证只在主节点验，公钥不下发。
  repeated SigningPublicKey ticket_public_keys = 7;
}

// 配置变了，从节点拉取新版本。
message ConfigChanged {
  string version = 1;
}

// 缓存作废（设计 6 第三类）。收到后从节点清掉对应缓存，下一个请求重新向主节点查询。
message Invalidation {
  // API Key 鉴权缓存键：原始 Key 的 SHA-256（十六进制）。新建 Key 也会发，
  // 用来清掉"查不到"的负缓存。
  repeated string api_key_hashes = 1;
  repeated int64 user_ids = 2;
  repeated int64 group_ids = 3;
}

// 主节点 → 从节点的事件信封。
// 字段号：1~9 信封本身；10~99 主节点指令；100~199 对从节点事件的回执；200 起留给以后。
message MasterEnvelope {
  uint64 seq = 1;
  oneof body {
    EventPing ping = 10;
    ConfigChanged config_changed = 11;
    Invalidation invalidation = 12;
    TicketRevocations ticket_revocations = 13;
    QuotaRecall quota_recall = 14;
  }
}

message EventPing {
  bytes payload = 1;
}

// ---- 签名（开发计划 WP5，internal/relay/sign）----

// 签名信封：payload 是 Ticket 或 Voucher 的 protobuf 编码，按收到的原始字节验签。
// 签名 = Ed25519(私钥, 用途串 || 0x00 || payload)，用途串区分票据和凭证，一种不能冒充另一种。
message SignedToken {
  // 签名密钥版本（keystore 的版本号）。
  uint32 key_version = 1;
  bytes payload = 2;
  bytes signature = 3;
}

message SigningPublicKey {
  uint32 version = 1;
  // Ed25519 公钥，32 字节。
  bytes public_key = 2;
}

// 中转票据（设计 8.1）：小白端访问分配的从节点用，10 分钟有效。
message Ticket {
  int64 user_id = 1;
  // 只能在这台从节点上用。
  int64 node_id = 2;
  // 签发时用户的 token_version（由邮箱和密码哈希推导）。主节点选号时和当前值比对，
  // 改密码、改邮箱后旧票据在下一个请求被拒，和登录态一致。
  int64 token_version = 3;
  int64 issued_at_unix_ms = 4;
  int64 expires_at_unix_ms = 5;
}

// 计费模式（设计 5.3）。
enum BillingMode {
  BILLING_MODE_UNSPECIFIED = 0;
  BILLING_MODE_BALANCE = 1;
  BILLING_MODE_SUBSCRIPTION = 2;
}

// 扣费凭证（设计 5.3）：主节点每次选号签发一张，从节点上报扣费记录时原样带回，主节点验签后才入账。
message Voucher {
  // UUID（16 字节）；与 issued_at 一起是 relay_voucher_consumed 的主键，每张只入账一次。
  bytes voucher_id = 1;
  int64 issued_at_unix_ms = 2;
  // 只能由这台从节点上报（入账时核对，WP8）。
  int64 node_id = 3;
  string selection_id = 4;
  int64 user_id = 5;
  int64 api_key_id = 6;
  int64 account_id = 7;
  int64 group_id = 8;
  BillingMode billing_mode = 9;
  string requested_model = 10;
  // 上报的实际模型必须在这里面，否则按请求模型计费并报警（设计 5.3）。
  repeated string allowed_billing_models = 11;
  Quote quote = 12;
  SelectionContext context = 13;
}

// 报价：签发时的计价输入，入账按它计价（设计 5.3、6 第一类）。
// 字段由 WP7 / WP8 按开发计划 2.2 的脚本补齐。金额用整数微单位（1 = 10⁻⁸），
// 单价按每百万 token 表示（按每 token 会出现小数，比如 0.075 美元每百万 token）。
message Quote {
}

// 选号上下文：扣费函数从请求上下文读、由选号决定的值，入账前原样恢复（设计 5.3）。
// 其余字段由 WP7 / WP8 按开发计划 2.2 的脚本补齐。
message SelectionContext {
  // 计价时间（openai_profit_control 的 pricingAt）。
  int64 pricing_at_unix_ms = 1;
}

// 票据吊销（设计 8.1）：这些用户在 revoked_before 及之前签发的票据作废。
// 从节点只拿它提前拒绝；以主节点选号时的复查为准。
message TicketRevocations {
  repeated RevokedTicketUser users = 1;
}

message RevokedTicketUser {
  int64 user_id = 1;
  int64 revoked_before_unix_ms = 2;
}

// ---- 额度（设计第 4 节，开发计划 WP6）。金额都是整数微单位（1 = 10⁻⁸）。----

message QuotaScope {
  string dimension = 1;
  // 订阅窗口为分组 ID，Key 维度为 API Key ID，其余为 0。
  int64 scope_id = 2;
  // 平台配额为平台名，其余为空。
  string scope_key = 3;
}

// 主节点给出的一项额度（随选号回复下发，WP7）。
message QuotaGrant {
  int64 lease_id = 1;
  int64 user_id = 2;
  QuotaScope scope = 3;
  // 这次新给的。
  int64 amount = 4;
  // 这份租约现在总共锁着的（含节点已用、未入账的）。
  int64 granted = 5;
  int64 expires_at_unix_ms = 6;
}

// 一份租约的退回：这份租约至今累计退回了多少（不是增量，跨纪元也不清零）。
// closed 表示节点放弃整份租约（剩下的全部退回）。
message LeaseReturn {
  int64 lease_id = 1;
  int64 user_id = 2;
  int64 returned_total = 3;
  bool closed = 4;
}

message ReleaseQuotaRequest {
  repeated LeaseReturn returns = 1;
}

message ReleaseQuotaResponse {
  // 主节点已不认的租约（已关闭、已作废）：节点立即丢弃，不再使用。
  repeated int64 dropped_lease_ids = 1;
}

message LeaseRenewal {
  int64 lease_id = 1;
  int64 user_id = 2;
  // 最后一次用这份额度的时间（闲置判断，设计 4.4）；没用过为 0。
  int64 last_used_at_unix_ms = 3;
}

message RenewLeasesRequest {
  repeated LeaseRenewal leases = 1;
}

message RenewedLease {
  int64 lease_id = 1;
  int64 expires_at_unix_ms = 2;
}

message RenewLeasesResponse {
  repeated RenewedLease renewed = 1;
  repeated int64 dropped_lease_ids = 2;
}

message HeldLease {
  int64 lease_id = 1;
  int64 user_id = 2;
}

message ReportLeasesRequest {
  repeated HeldLease leases = 1;
}

message ReportLeasesResponse {
  repeated int64 dropped_lease_ids = 1;
}

// 主节点要求收回某个用户的一项子额度（设计 4.2、4.4）。idle_only 时只收回闲置的。
message QuotaRecall {
  string recall_id = 1;
  int64 user_id = 2;
  QuotaScope scope = 3;
  bool idle_only = 4;
}

message AckQuotaRecallRequest {
  string recall_id = 1;
  repeated LeaseReturn returns = 2;
}

message AckQuotaRecallResponse {
  repeated int64 dropped_lease_ids = 1;
}

// ---- 选号（开发计划 WP7）----
// 选号的入口类型：决定主节点复用哪一套本地选号流程（WP7 按入口逐个接入）。
enum SelectEndpoint {
  SELECT_ENDPOINT_UNSPECIFIED = 0;
  // OpenAI Responses（/v1/responses 及别名、/responses/compact）。
  SELECT_ENDPOINT_OPENAI_RESPONSES = 1;
  // OpenAI Chat Completions。
  SELECT_ENDPOINT_OPENAI_CHAT = 2;
}

message SelectRequest {
  // 从节点为这次客户端请求起的 ID。同一请求的多次选号（换号）共用：用户并发槽、利润否决次数、
  // 已排除的账号按请求记在主节点。
  string request_id = 1;
  // 这次请求里的第几次选号（从 1 开始），与 request_id 一起作幂等键。
  uint32 attempt = 2;
  // 客户端凭据原文：主节点自己验证，不信从节点的鉴权结论（设计 8.2）。
  oneof credential {
    string api_key = 3;
  }
  // 从节点按信任代理规则解析出的客户端 IP（IP 黑白名单、全局黑名单、cyber 会话范围用）。
  string client_ip = 4;
  string method = 5;
  // 入口路径（鉴权跳过计费、额度错误格式按它判断）。
  string path = 6;
  SelectEndpoint endpoint = 7;
  string model = 8;
  bool stream = 9;
  // 会话哈希（从节点按请求头和请求体算出）。
  string session_hash = 10;
  string previous_response_id = 11;
  // 显式生图意图（能力路由、分组是否允许生图）。
  bool image_intent = 12;
  // /responses/compact 旧路径；原生 v2 压缩。
  bool legacy_compact = 13;
  bool native_compaction_v2 = 14;
  // 本请求此前尝试失败、要排除的账号。
  repeated int64 excluded_account_ids = 15;
  // cyber 会话屏蔽要查的键（开关打开时由从节点算出，设计 3.4）。
  CyberSessionLookup cyber = 16;
  // 从节点手里这个用户各项子额度还没用掉的金额：主节点据此决定是否随选号补充。
  repeated HeldQuota held_quota = 17;
  // 请求里可能被下游解析到的全部模型名（分组模型白名单逐一检查，规则同 GroupModelAllowlist 中间件）。
  repeated string model_candidates = 18;
}

// cyber 会话屏蔽的查询键（都已哈希）。
message CyberSessionLookup {
  string explicit_key = 1;
  string scope_key = 2;
  repeated string transcript_keys = 3;
  // 请求体里的候选键超过上限被截断（范围已激活时按命中处理）。
  bool transcript_truncated = 4;
}

message HeldQuota {
  QuotaScope scope = 1;
  int64 unused = 2;
}

message SelectResponse {
  oneof result {
    Selection selection = 1;
    SelectRejection rejection = 2;
  }
}

// 拒绝的响应格式：从节点按它写客户端响应，与单机版一致。
enum RejectionFormat {
  REJECTION_FORMAT_UNSPECIFIED = 0;
  // 网关处理函数的错误：status / error_type / code / message，从节点按入口协议写出
  // （流式已开始时写流内错误）；cyber_block_key 非空时按 cyber 屏蔽的写法。
  REJECTION_FORMAT_GATEWAY = 1;
  // 处理函数之前的中间件（鉴权、黑名单、模型白名单、未分组拦截）写出的响应：
  // 主节点按本地同样的写法生成，从节点原样写出 status / headers / body。
  REJECTION_FORMAT_RAW = 2;
  // 换号用完：从节点按它最近一次上游错误写出（continuation_unsupported 时按"续链不支持"的 400）。
  REJECTION_FORMAT_FAILOVER_EXHAUSTED = 3;
  // 这个请求还不能经从节点处理（自动分组、组合平台分组、尚未接入的平台）：从节点交给主节点转发。
  REJECTION_FORMAT_UNSUPPORTED = 4;
}

message SelectRejection {
  int32 status = 1;
  // 网关格式的错误类型（如 invalid_request_error）；鉴权格式为空。
  string error_type = 2;
  string code = 3;
  string message = 4;
  RejectionFormat format = 5;
  // 大于 0 时写 Retry-After。
  int32 retry_after_seconds = 6;
  // 运维标记，与单机版在同一位置打的一致。
  bool routing_capacity_limited = 7;
  string ops_business_limited_reason = 8;
  string ingress_reject_reason = 9;
  // 命中 cyber 会话屏蔽的键（从节点记运维日志用）。
  string cyber_block_key = 10;
  // REJECTION_FORMAT_RAW 的响应头和响应体。
  map<string, string> headers = 11;
  bytes body = 12;
  // REJECTION_FORMAT_FAILOVER_EXHAUSTED：这次选号里因为 previous_response_id 跳过了 OAuth 账号，
  // 最后的错误是"续链不支持"。
  bool continuation_unsupported = 13;
}

message Selection {
  // 主节点起的选号 ID：释放、取凭据、补额度都按它。
  string selection_id = 1;
  int64 user_id = 2;
  int64 api_key_id = 3;
  // 本次使用的分组（0 表示未分组）与计费模式。
  int64 group_id = 4;
  BillingMode billing_mode = 5;
  AccountSnapshot account = 6;
  // 渠道映射后发给上游的模型；channel_mapped 为是否发生了映射。
  string forward_model = 7;
  bool channel_mapped = 8;
  string channel_mapped_model = 9;
  int64 channel_id = 10;
  string billing_model_source = 11;
  // 实际使用的会话哈希（池模式账号可能改写），后续选号和释放都用它。
  string session_hash = 12;
  // 扣费凭证：SignedToken（payload 是 Voucher）的编码。上报扣费时原样带回，主节点按这些字节验签。
  bytes voucher = 13;
  // 这次请求用到的各项子额度，和最低预估费用（从节点按它预扣）。
  repeated QuotaScope quota_scopes = 14;
  int64 quota_need = 15;
  // 随选号补充的额度。
  repeated QuotaGrant grants = 16;
  // 本请求的换号上限。
  int32 max_account_switches = 17;
  // 当前配置版本，从节点落后时先同步拉取。
  string config_version = 18;
  int64 pricing_at_unix_ms = 19;
}

message FetchCredentialsRequest {
  string selection_id = 1;
}

message FetchCredentialsResponse {
  // 只含 id、credential_version、sealed_credentials。
  AccountSnapshot account = 1;
}

message RefillQuotaRequest {
  string selection_id = 1;
  repeated HeldQuota held_quota = 2;
  // 这次要保证的最少金额（每一项"手里没用掉的 + 这次给的"都要不少于它）。
  int64 need = 3;
}

message RefillQuotaResponse {
  repeated QuotaGrant grants = 1;
}

// 选号用完（这次尝试结束），经事件连接发送、不等回复（设计 3.1）。按 selection_id 幂等。
message SelectionRelease {
  string selection_id = 1;
  // 这是这次客户端请求的最后一次尝试：主节点同时放掉按请求占的用户并发槽。
  bool request_done = 2;
  // 上游返回的 response id（Responses），主节点记下账号和归属，后续 previous_response_id 用。
  repeated string response_ids = 3;
}


// 账号快照：选号结果里给从节点转发用的账号（设计 2.2、9）。按白名单编码
// （internal/relay/accountcodec）：转发要用的普通配置原样带上；密钥（上游 Key、短期 access token、
// 代理密码、自定义请求头等白名单外的一切）放进 sealed_credentials，用这台节点的 X25519 加密公钥
// 加密（设计 7.1），附加数据绑定节点、账号和凭据版本。refresh token、client secret、服务账号文件
// 永远不离开主节点。
message AccountSnapshot {
  int64 id = 1;
  string name = 2;
  string platform = 3;
  string type = 4;
  int32 concurrency = 5;
  int32 priority = 6;
  // 未声明时 has_rate_multiplier 为 false（按 1.0 处理）。
  bool has_rate_multiplier = 7;
  double rate_multiplier = 8;
  bool rate_multiplier_undeclared = 9;
  string status = 10;
  // 白名单内的凭据字段（JSON 对象）。
  bytes public_credentials = 11;
  // Extra（JSON 对象），名字像密钥的字段已剔除。
  bytes extra = 12;
  int64 parent_account_id = 13;
  string quota_dimension = 14;
  repeated int64 group_ids = 15;
  ProxySnapshot proxy = 16;
  // 贡献房间路由的结果（只对这一次请求有效）。
  string contribution_route_source = 17;
  int64 contribution_room_id = 18;
  bool has_contribution_rate_multiplier_override = 19;
  double contribution_rate_multiplier_override = 20;
  // 凭据版本：密钥内容的哈希。节点已有同一版本时 sealed_credentials 为空，用本地缓存的（设计 9.1）。
  string credential_version = 21;
  bytes sealed_credentials = 22;
}

// 代理快照；用户名、密码在 sealed_credentials 里（键 __proxy_username / __proxy_password）。
message ProxySnapshot {
  int64 id = 1;
  string name = 2;
  string protocol = 3;
  string host = 4;
  int32 port = 5;
  string status = 6;
  bool has_owner_user_id = 7;
  int64 owner_user_id = 8;
}

